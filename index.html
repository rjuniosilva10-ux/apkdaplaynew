   COMMAND PALETTE
============================================================ */
let paletteItems = [];
let paletteSelected = 0;

function openPalette() {
    $('paletteOverlay').classList.add('active');
    $('paletteInput').value = '';
    $('paletteInput').focus();
    buildPaletteItems('');
}

function closePalette() {
    $('paletteOverlay').classList.remove('active');
}

function buildPaletteItems(query) {
    const q = query.toLowerCase().trim();
    const items = [];

    // Navigation
    const navs = [
        { icon: '🎵', title: 'Músicas', sub: 'Ir para biblioteca', action: () => goToView('musicas') },
        { icon: '❤️', title: 'Favoritas', sub: 'Ir para favoritas', action: () => goToView('favoritas') },
        { icon: '📖', title: 'Bíblia', sub: 'Ir para Bíblia', action: () => goToView('biblia') },
        { icon: '📺', title: 'YouTube', sub: 'Ir para YouTube', action: () => goToView('youtube') }
    ];

    // Actions
    const actions = [
        { icon: '🎲', title: 'Aleatório', sub: 'Alternar modo aleatório', action: () => toggleShuffle() },
        { icon: '🔁', title: 'Repetir', sub: 'Alternar repetição', action: () => toggleRepeat() },
        { icon: '🌙', title: 'Sleep Timer', sub: 'Definir timer de sono', action: () => { closePalette(); toggleSleepMenu(); } },
        { icon: '☀️', title: 'Tema', sub: 'Alternar tema claro/escuro', action: () => toggleTheme() },
        { icon: '➕', title: 'Adicionar Música', sub: 'Enviar arquivo de áudio', action: () => { closePalette(); document.getElementById('musicUpload').click(); } },
        { icon: '⏸️', title: 'Pausar', sub: 'Pausar reprodução', action: () => { if (!audio.paused) togglePlay(); } }
    ];

    // Filter navigation/actions by query
    if (q) {
        [...navs, ...actions].filter(item =>
            item.title.toLowerCase().includes(q) || item.sub.toLowerCase().includes(q)
        ).forEach(item => items.push({ ...item, section: 'Ações' }));
    } else {
        navs.forEach(item => items.push({ ...item, section: 'Navegar' }));
        actions.forEach(item => items.push({ ...item, section: 'Ações' }));
    }

    // Songs
    const songsFiltered = allSongs.filter(s =>
        !q || s.title.toLowerCase().includes(q) || (s.artist||'').toLowerCase().includes(q)
    ).slice(0, 8);

    if (songsFiltered.length > 0) {
        songsFiltered.forEach(s => {
            items.push({
                icon: `<img src="${escapeHtml(s.cover || 'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=400&h=400&fit=crop')}" alt="">`,
                title: s.title,
                sub: s.artist || 'Desconhecido',
                section: q ? 'Músicas' : 'Músicas',
                action: () => { closePalette(); playSong(s.id); }
            });
        });
    }

    paletteItems = items;
    paletteSelected = 0;
    renderPalette();
}

function renderPalette() {
    const results = $('paletteResults');
    if (paletteItems.length === 0) {
        results.innerHTML = '<div class="palette-empty"><span class="emoji">🔍</span>Nenhum resultado</div>';
        return;
    }
    let html = '';
    let lastSection = '';
    paletteItems.forEach((item, i) => {
        if (item.section !== lastSection) {
            html += `<div class="palette-section-label">${escapeHtml(item.section)}</div>`;
            lastSection = item.section;
        }
        html += `
            <div class="palette-item ${i === paletteSelected ? 'selected' : ''}" data-idx="${i}">
                <div class="palette-item-icon">${item.icon}</div>
                <div class="palette-item-content">
                    <div class="palette-item-title">${escapeHtml(item.title)}</div>
                    <div class="palette-item-sub">${escapeHtml(item.sub)}</div>
                </div>
            </div>
        `;
    });
    results.innerHTML = html;

    // Attach click handlers
    results.querySelectorAll('.palette-item').forEach(el => {
        el.addEventListener('click', () => {
            const idx = parseInt(el.dataset.idx);
            paletteItems[idx].action();
        });
    });
}

function goToView(view) {
    closePalette();
    const nav = document.querySelector(`.nav-item[data-view="${view}"]`);
    if (nav) nav.click();
}

$('paletteInput').addEventListener('input', (e) => {
    buildPaletteItems(e.target.value);
});

$('paletteInput').addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') {
        e.preventDefault();
        paletteSelected = Math.min(paletteItems.length - 1, paletteSelected + 1);
        renderPalette();
        scrollSelected();
    } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        paletteSelected = Math.max(0, paletteSelected - 1);
        renderPalette();
        scrollSelected();
    } else if (e.key === 'Enter') {
        e.preventDefault();
        if (paletteItems[paletteSelected]) paletteItems[paletteSelected].action();
    } else if (e.key === 'Escape') {
        closePalette();
    }
});

function scrollSelected() {
    const el = document.querySelector('.palette-item.selected');
    if (el) el.scrollIntoView({ block: 'nearest' });
}

function toggleSleepMenu(e) {
    if (e) e.stopPropagation();
    $('sleepMenu').classList.toggle('active');

document.querySelectorAll('#sleepMenu button').forEach(btn => {
    btn.addEventListener('click', () => {
        const val = btn.dataset.sleep;
        if (sleepTimerId) { clearTimeout(sleepTimerId); sleepTimerId = null; }
        sleepMode = val;
        if (val === '0') {
            sleepEndAt = null;
            toast('Sleep Timer desativado');
        } else if (val === 'end') {
            sleepEndAt = null;
            toast('🌙 Vai pausar no fim da faixa');
        } else {
            const mins = parseInt(val);
            sleepEndAt = Date.now() + mins * 60000;
            sleepTimerId = setTimeout(() => {
                audio.pause();
                sleepMode = 'off';
                updateSleepUI();
                toast('🌙 Sleep Timer: pausado');
            }, mins * 60000);
            toast(`🌙 Sleep Timer: ${mins} min`);
        }
        updateSleepUI();
        $('sleepMenu').classList.remove('active');
    });
});

function updateSleepUI() {
    const btn = $('sleepBtn');
    btn.classList.toggle('active', sleepMode !== 'off' && sleepMode !== '0');
    document.querySelectorAll('#sleepMenu button').forEach(b => {
        b.classList.toggle('active', b.dataset.sleep === sleepMode);
    });
}

document.addEventListener('click', (e) => {
    if (!e.target.closest('#sleepMenu') && !e.target.closest('#sleepBtn')) {

});

    }
    // Escape
    if (e.key === 'Escape') {
        if ($('paletteOverlay').classList.contains('active')) { closePalette(); return; }
        if (!$('ytModal').classList.contains('hidden')) { closeYtPlayer(); return; }
        if ($('expandedPlayer').classList.contains('active')) { closeExpanded(); return; }
    }
    // Ignore in inputs
    if (['INPUT','TEXTAREA'].includes(e.target.tagName)) return;
    if ($('paletteOverlay').classList.contains('active')) return;

    switch (e.key.toLowerCase()) {
        case ' ':
            e.preventDefault(); togglePlay(); break;
        case 'arrowright':
            if (audio.duration) { audio.currentTime = Math.min(audio.duration, audio.currentTime + 5); e.preventDefault(); }
            break;
        case 'arrowleft':
            if (audio.duration) { audio.currentTime = Math.max(0, audio.currentTime - 5); e.preventDefault(); }
            break;
        case 'm': toggleMute(); break;
        case 'l': toggleFavorite(currentId); break;
        case 'f': openExpanded(); break;
        case '1': goToView('musicas'); break;
        case '2': goToView('favoritas'); break;
        case '3': goToView('biblia'); break;
        case '4': goToView('youtube'); break;
    }
});

document.addEventListener('DOMContentLoaded', async () => {
    // Load favorites
    try {
        const savedFavs = JSON.parse(localStorage.getItem('dauplay_favs') || '[]');
        favorites = new Set(Array.isArray(savedFavs) ? savedFavs : []);
    } catch { favorites = new Set(); }

    // Load YouTube
    try {
        const savedYt = JSON.parse(localStorage.getItem('dauplay_yt') || '[]');
        ytLinks = Array.isArray(savedYt) ? savedYt.filter(v => v && v.id && /^[\w-]{11}$/.test(v.id)) : [];
    } catch { ytLinks = []; }

    // Load recent
    try {
        recentTracks = JSON.parse(localStorage.getItem('dauplay_recent') || '[]');
    } catch { recentTracks = []; }

    await loadSongs();
    setupGridDelegation($('musicGrid'));
    setupGridDelegation($('favGrid'));
    setupProgressBar();
    initVolume();

    $('ytInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') addYoutubeLink();
    });

    // Preload default color
    setDynamicColor(29, 185, 84);
});
</script>
