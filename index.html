<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Dauplay — Sua Música, Sua Fé. Player, Bíblia offline com voz e YouTube.">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dauplay">
<meta name="mobile-web-app-capable" content="yes">
<title>Dauplay — Sua Música, Sua Fé.</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎵%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DAUPLAY — REVOLUTION EDITION
   Aurora · Glass · 3D · Real Audio Visualization
============================================================ */

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{
    --bg-base:#06060a;
    --bg-elev:#0c0c14;
    --bg-glass:rgba(15,15,22,.65);
    --bg-glass-strong:rgba(18,18,26,.85);
    --bg-card:rgba(255,255,255,.03);
    --bg-card-hover:rgba(255,255,255,.06);
    --border-glass:rgba(255,255,255,.07);
    --border-light:rgba(255,255,255,.12);
    --text-main:#fff;
    --text-muted:#8a8a99;
    --text-dim:#5a5a6b;

    /* Dynamic — alterado via JS conforme a capa da música */
    --dyn: 29,185,84;
    --dyn-2: 0,212,255;
    --accent:rgb(var(--dyn));
    --accent-2:rgb(var(--dyn-2));
    --accent-glow:rgba(var(--dyn),.4);
    --gradient-1:linear-gradient(135deg, rgb(var(--dyn)), rgb(var(--dyn-2)));

    --shadow-card:0 24px 48px -16px rgba(0,0,0,.9);
    --shadow-glow:0 0 40px -8px rgba(var(--dyn),.45);

    --player-height:88px;
    --radius:20px;
    --radius-sm:14px;
    --radius-lg:28px;

    --ease-spring:cubic-bezier(.34,1.56,.64,1);
    --ease-smooth:cubic-bezier(.4,0,.2,1);

    --sidebar-w:248px;
}

body.light-mode{
    --bg-base:#f4f5f9;
    --bg-elev:#fff;
    --bg-glass:rgba(255,255,255,.75);
    --bg-glass-strong:rgba(255,255,255,.92);
    --bg-card:rgba(0,0,0,.03);
    --bg-card-hover:rgba(0,0,0,.06);
    --border-glass:rgba(0,0,0,.07);
    --border-light:rgba(0,0,0,.12);
    --text-main:#0a0a15;
    --text-muted:#5a5a6b;
    --text-dim:#9090a0;
    --shadow-card:0 24px 48px -16px rgba(30,30,60,.15);
}

html,body{height:100%}
body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    background:var(--bg-base);
    color:var(--text-main);
    display:flex;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    transition:background .5s var(--ease-smooth),color .3s;
    position:relative;
}

/* Aurora animated background */
body::before,
body::after{
    content:'';
    position:fixed;
    inset:-20%;
    pointer-events:none;
    z-index:0;
    transition:opacity .6s;
}
body::before{
    background:
        radial-gradient(ellipse at 15% 25%, rgba(var(--dyn),.22) 0%, transparent 45%),
        radial-gradient(ellipse at 85% 75%, rgba(var(--dyn-2),.18) 0%, transparent 45%),
        radial-gradient(ellipse at 50% 50%, rgba(140,60,255,.10) 0%, transparent 55%);
    animation:auroraShift 24s ease-in-out infinite, auroraHue 40s linear infinite;
    filter:blur(20px);
}
body::after{
    background:
        radial-gradient(ellipse at 80% 20%, rgba(var(--dyn-2),.10) 0%, transparent 40%),
        radial-gradient(ellipse at 20% 80%, rgba(var(--dyn),.10) 0%, transparent 40%);
    animation:auroraShift 30s ease-in-out infinite reverse;
    filter:blur(40px);
}
body.light-mode::before{opacity:.35}
body.light-mode::after{opacity:.25}

@keyframes auroraShift{
    0%,100%{transform:translate(0,0) scale(1)}
    33%{transform:translate(3%,-2%) scale(1.08)}
    66%{transform:translate(-2%,3%) scale(1.04)}
}
@keyframes auroraHue{
    0%{filter:blur(20px) hue-rotate(0deg)}
    100%{filter:blur(20px) hue-rotate(360deg)}
}

/* ============================================================
   SPLASH
============================================================ */
#splashScreen{
    position:fixed;inset:0;background:#06060a;z-index:99999;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    transition:opacity .7s var(--ease-smooth), transform .7s;
}
#splashScreen.fade-out{opacity:0;transform:scale(1.1);pointer-events:none}
.splash-content{
    animation:splashIn .8s var(--ease-spring) both;
    position:relative;
}
.splash-content::before{
    content:'';position:absolute;inset:-40px;
    background:radial-gradient(circle, rgba(29,185,84,.35), transparent 65%);
    filter:blur(30px);animation:pulseGlow 2.5s ease-in-out infinite;
    z-index:-1;
}
@keyframes pulseGlow{0%,100%{transform:scale(.9);opacity:.6}50%{transform:scale(1.2);opacity:1}}
@keyframes splashIn{
    from{opacity:0;transform:scale(.7) translateY(20px)}
    to{opacity:1;transform:scale(1) translateY(0)}
}
.splash-img,#splashSvg{
    width:160px;height:160px;border-radius:36px;
    box-shadow:0 24px 80px rgba(29,185,84,.5), 0 0 0 1px rgba(255,255,255,.08);
    object-fit:cover;display:block;
}
.splash-loader{
    margin-top:48px;width:140px;height:3px;
    background:rgba(255,255,255,.08);border-radius:99px;
    overflow:hidden;position:relative;
}
.splash-bar{
    position:absolute;left:-50%;width:50%;height:100%;
    background:linear-gradient(90deg, transparent, #1db954, #00d4ff, transparent);
    border-radius:99px;
    animation:loadBar 1.4s cubic-bezier(.65,.05,.36,1) infinite;
}
@keyframes loadBar{0%{left:-50%}100%{left:100%}}

/* ============================================================
   SIDEBAR
============================================================ */
.sidebar{
    width:var(--sidebar-w);
    background:var(--bg-glass);
    backdrop-filter:blur(32px) saturate(1.4);
    -webkit-backdrop-filter:blur(32px) saturate(1.4);
    border-right:1px solid var(--border-glass);
    display:flex;flex-direction:column;
    padding:28px 16px 20px;
    z-index:100;
    position:relative;
    transition:transform .4s var(--ease-smooth);
}
.sidebar::after{
    content:'';position:absolute;top:0;right:0;bottom:0;width:1px;
    background:linear-gradient(180deg, transparent, rgba(var(--dyn),.4), transparent);
    opacity:.6;
}

.logo{
    font-size:22px;font-weight:800;letter-spacing:-1.2px;
    margin-bottom:36px;padding-left:12px;
    display:flex;align-items:center;gap:10px;
    position:relative;
}
.logo::before{
    content:'';width:30px;height:30px;border-radius:9px;
    background:var(--gradient-1);
    box-shadow:0 4px 20px var(--accent-glow);
    display:inline-block;flex-shrink:0;
    position:relative;
}
.logo::after{
    content:'♪';position:absolute;left:6px;top:50%;transform:translateY(-52%);
    font-size:16px;color:#000;font-weight:900;pointer-events:none;
}
.logo span{
    background:var(--gradient-1);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    background-clip:text;
}

.nav-menu{display:flex;flex-direction:column;gap:4px;flex:1}
.nav-item{
    display:flex;align-items:center;gap:14px;
    padding:12px 14px;border-radius:12px;cursor:pointer;
    color:var(--text-muted);font-weight:500;font-size:14px;
    transition:all .3s var(--ease-smooth);
    position:relative;overflow:hidden;
}
.nav-item::before{
    content:'';position:absolute;inset:0;
    background:var(--gradient-1);opacity:0;transition:opacity .3s;
    z-index:-1;
}
.nav-item:hover{color:var(--text-main);background:var(--bg-card-hover)}
.nav-item.active{
    color:var(--text-main);
    background:rgba(var(--dyn),.12);
    box-shadow:inset 0 0 0 1px rgba(var(--dyn),.25);
}
.nav-item.active::after{
    content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
    width:3px;height:22px;background:var(--gradient-1);
    border-radius:0 3px 3px 0;
    box-shadow:0 0 12px var(--accent-glow);
}
.nav-item svg{width:20px;height:20px;fill:currentColor;flex-shrink:0;transition:transform .3s var(--ease-spring)}
.nav-item.active svg{color:var(--accent);transform:scale(1.1)}
.nav-item:active{transform:scale(.97)}

.nav-shortcut{
    margin-left:auto;font-family:'JetBrains Mono',monospace;
    font-size:10px;color:var(--text-dim);
    padding:2px 6px;border-radius:4px;
    background:rgba(255,255,255,.05);border:1px solid var(--border-glass);
    opacity:0;transition:opacity .2s;
}
.nav-item:hover .nav-shortcut{opacity:1}

.theme-btn{
    margin-top:auto;
    display:flex;align-items:center;justify-content:center;gap:8px;
    padding:12px;border-radius:12px;
    background:var(--bg-card);border:1px solid var(--border-glass);
    color:var(--text-main);cursor:pointer;
    font-weight:600;font-size:12px;font-family:inherit;
    transition:all .3s var(--ease-smooth);
}
.theme-btn:hover{background:var(--bg-card-hover);border-color:var(--border-light);transform:translateY(-1px)}
.theme-btn:active{transform:scale(.97)}

/* ============================================================
   MAIN
============================================================ */
.main-content{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;z-index:1}

.header{
    padding:28px 40px 16px;
    display:flex;justify-content:space-between;align-items:center;
    gap:20px;z-index:10;
}
.header h1{
    font-size:30px;font-weight:800;letter-spacing:-1px;
    background:linear-gradient(135deg, var(--text-main) 0%, var(--text-muted) 100%);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    background-clip:text;
    animation:fadeIn .5s var(--ease-smooth);
}

.header-actions{display:flex;align-items:center;gap:10px}

.search-box{
    position:relative;display:flex;align-items:center;
    background:var(--bg-card);border:1px solid var(--border-glass);
    border-radius:12px;padding:0 14px;height:42px;
    transition:all .3s var(--ease-smooth);width:240px;
}
.search-box:focus-within{
    width:300px;border-color:rgba(var(--dyn),.5);
    box-shadow:0 0 0 3px rgba(var(--dyn),.1);
}
.search-box svg{width:16px;height:16px;fill:var(--text-muted);flex-shrink:0}
.search-box input{
    flex:1;background:none;border:none;outline:none;
    color:var(--text-main);font-size:13px;font-family:inherit;
    padding:0 10px;
}
.search-box input::placeholder{color:var(--text-dim)}

.kbd-hint{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;color:var(--text-dim);
    padding:3px 6px;border-radius:5px;
    background:rgba(255,255,255,.05);
    border:1px solid var(--border-glass);
    white-space:nowrap;
}

.icon-btn{
    width:42px;height:42px;border-radius:12px;
    background:var(--bg-card);border:1px solid var(--border-glass);
    color:var(--text-main);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:all .3s var(--ease-smooth);
    flex-shrink:0;
}
.icon-btn:hover{background:var(--bg-card-hover);border-color:var(--border-light);transform:translateY(-1px)}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:18px;height:18px;fill:currentColor}
.theme-btn-mobile{display:none}

/* Views */
.view-container{
    flex:1;overflow-y:auto;
    padding:0 40px calc(var(--player-height) + 48px);
    scroll-behavior:smooth;
}
.view-container::-webkit-scrollbar{width:8px}
.view-container::-webkit-scrollbar-track{background:transparent}
.view-container::-webkit-scrollbar-thumb{
    background:rgba(var(--dyn),.25);border-radius:99px;
    transition:background .3s;
}
.view-container::-webkit-scrollbar-thumb:hover{background:rgba(var(--dyn),.5)}

.view-section{display:none}
.view-section.active{display:block;animation:viewIn .5s var(--ease-smooth)}
@keyframes viewIn{
    from{opacity:0;transform:translateY(12px)}
    to{opacity:1;transform:translateY(0)}
}
@keyframes fadeIn{
    from{opacity:0;transform:translateY(8px)}
    to{opacity:1;transform:translateY(0)}
}

/* ============================================================
   MUSIC CARDS — 3D tilt
============================================================ */
.music-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    gap:20px;
}

.music-card{
    background:var(--bg-card);
    border:1px solid var(--border-glass);
    border-radius:var(--radius);
    padding:14px;
    cursor:pointer;
    position:relative;
    transition:transform .45s var(--ease-spring),
               box-shadow .45s var(--ease-smooth),
               border-color .3s,
               background .3s;
    transform-style:preserve-3d;
    will-change:transform;
}
.music-card:hover{
    background:var(--bg-card-hover);
    border-color:rgba(var(--dyn),.35);
    box-shadow:var(--shadow-card),var(--shadow-glow);
}
.music-card.active{
    border-color:rgba(var(--dyn),.7);
    box-shadow:0 0 0 1px rgba(var(--dyn),.4), 0 0 32px -4px rgba(var(--dyn),.5);
}
.music-card.active .card-img-wrapper::before{
    content:'';position:absolute;inset:0;
    background:linear-gradient(135deg, rgba(var(--dyn),.3), transparent 60%);
    z-index:2;pointer-events:none;
}

.card-img-wrapper{
    width:100%;aspect-ratio:1;
    border-radius:12px;overflow:hidden;
    margin-bottom:12px;position:relative;
    background:linear-gradient(135deg, #222 0%, #333 100%);
    box-shadow:0 8px 24px -8px rgba(0,0,0,.7);
    transform:translateZ(20px);
}
.card-img-wrapper::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(180deg, transparent 60%, rgba(0,0,0,.6) 100%);
    opacity:0;transition:opacity .3s;
}
.music-card:hover .card-img-wrapper::after{opacity:1}
.card-img-wrapper img{
    width:100%;height:100%;object-fit:cover;
    transition:transform .6s var(--ease-smooth);
}
.music-card:hover .card-img-wrapper img{transform:scale(1.1)}

.card-title{
    font-size:13px;font-weight:700;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    margin-bottom:3px;letter-spacing:-.2px;
}
.card-artist{
    font-size:11px;color:var(--text-muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

.fav-btn,.del-btn{
    position:absolute;top:20px;
    width:30px;height:30px;border-radius:50%;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.2);
    color:white;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:all .3s var(--ease-spring);
    z-index:5;padding:0;font-size:12px;
    opacity:0;transform:scale(.7);
}
.fav-btn{right:20px;background:rgba(0,0,0,.65)}
.del-btn{left:20px;background:rgba(220,53,69,.75)}
.music-card:hover .fav-btn,
.music-card:hover .del-btn{opacity:1;transform:scale(1)}
.fav-btn:hover{transform:scale(1.2)!important;background:rgba(29,185,84,.9)}
.fav-btn.active{opacity:1;transform:scale(1)!important;background:rgba(29,185,84,.95);border-color:rgba(255,255,255,.4)}
.del-btn:hover{transform:scale(1.2)!important;background:rgb(220,53,69)}
.del-btn svg{width:14px;height:14px;fill:white}
.fav-btn svg{width:14px;height:14px;fill:currentColor}

/* ============================================================
   BÍBLIA
============================================================ */
.bible-layout{display:flex;gap:32px;height:calc(100vh - 200px)}
.bible-sidebar{
    width:230px;overflow-y:auto;
    display:flex;flex-direction:column;gap:3px;
    padding-right:20px;border-right:1px solid var(--border-glass);
}
.bible-sidebar::-webkit-scrollbar{width:5px}
.bible-sidebar::-webkit-scrollbar-thumb{background:rgba(var(--dyn),.3);border-radius:99px}

.bible-book-btn{
    padding:10px 14px;background:transparent;border:none;
    color:var(--text-muted);text-align:left;
    font-size:13px;border-radius:10px;cursor:pointer;
    transition:all .25s var(--ease-smooth);font-family:inherit;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.bible-book-btn:hover{background:var(--bg-card-hover);color:var(--text-main);transform:translateX(2px)}
.bible-book-btn.active{
    background:rgba(var(--dyn),.12);color:var(--text-main);
    font-weight:600;box-shadow:inset 2px 0 0 var(--accent);
}

.bible-reader{flex:1;overflow-y:auto;padding-right:16px}
.bible-reader::-webkit-scrollbar{width:6px}
.bible-reader::-webkit-scrollbar-thumb{background:rgba(var(--dyn),.3);border-radius:99px}

.chapter-selector{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
.chapter-btn{
    width:40px;height:40px;border-radius:50%;
    background:var(--bg-card);border:1px solid var(--border-glass);
    color:var(--text-main);cursor:pointer;font-size:13px;
    transition:all .3s var(--ease-spring);font-family:inherit;font-weight:600;
}
.chapter-btn:hover{background:var(--bg-card-hover);border-color:var(--border-light);transform:translateY(-2px)}
.chapter-btn.active{
    background:var(--gradient-1);color:#000;font-weight:800;
    border-color:transparent;
    box-shadow:0 8px 24px -4px rgba(var(--dyn),.6);
    transform:translateY(-2px);
}

.bible-text-content{
    font-family:'Playfair Display',serif;
    font-size:18px;line-height:1.95;
    color:rgba(255,255,255,.85);
}
body.light-mode .bible-text-content{color:rgba(10,10,20,.82)}
.bible-text-content p{margin-bottom:24px;animation:verseIn .5s var(--ease-smooth) backwards}
.bible-text-content p:nth-child(1){animation-delay:.05s}
.bible-text-content p:nth-child(2){animation-delay:.08s}
.bible-text-content p:nth-child(3){animation-delay:.11s}
.bible-text-content p:nth-child(n+4){animation-delay:.14s}
@keyframes verseIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.verse-num{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;color:var(--accent);font-weight:700;
    margin-right:8px;vertical-align:super;
}

.tts-bar{margin-bottom:28px;display:flex;gap:10px;flex-wrap:wrap}
.tts-btn{
    padding:11px 20px;background:var(--bg-card);
    border:1px solid var(--border-glass);
    color:var(--text-main);border-radius:12px;
    font-size:13px;font-weight:600;cursor:pointer;
    transition:all .3s var(--ease-spring);font-family:inherit;
    display:inline-flex;align-items:center;gap:8px;
}
.tts-btn:hover{background:var(--bg-card-hover);border-color:rgba(var(--dyn),.4);transform:translateY(-1px)}
.tts-btn.playing{
    background:var(--gradient-1);color:#000;border-color:transparent;
    box-shadow:0 8px 24px -6px rgba(var(--dyn),.6);
}

.bible-download-card{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    height:100%;min-height:400px;text-align:center;
    padding:56px 40px;
    background:var(--bg-card);border:1px dashed rgba(var(--dyn),.3);
    border-radius:var(--radius-lg);gap:16px;
    animation:fadeIn .6s var(--ease-smooth);
}
.bible-download-card .icon{font-size:64px;filter:drop-shadow(0 8px 24px rgba(var(--dyn),.5))}
.bible-download-card h2{font-size:26px;font-weight:800;letter-spacing:-.5px}
.bible-download-card p{color:var(--text-muted);max-width:400px;line-height:1.65;font-size:14px}
.btn-download{
    padding:16px 36px;background:var(--gradient-1);color:#000;
    border:none;border-radius:14px;font-size:15px;font-weight:800;
    cursor:pointer;transition:all .3s var(--ease-spring);margin-top:12px;
    font-family:inherit;letter-spacing:.3px;
    box-shadow:0 12px 32px -8px rgba(var(--dyn),.6);
}
.btn-download:hover{transform:translateY(-2px) scale(1.02);filter:brightness(1.1);box-shadow:0 16px 40px -8px rgba(var(--dyn),.7)}
.btn-download:disabled{opacity:.5;cursor:wait;transform:none;box-shadow:none}
.status{font-size:13px;color:var(--text-muted);min-height:20px;font-weight:500}
.status.error{color:#f87171}
.status.success{color:var(--accent)}

/* ============================================================
   YOUTUBE
============================================================ */
.yt-input-wrapper{display:flex;gap:12px;margin-bottom:32px}
.yt-input-wrapper input{
    flex:1;padding:16px 20px;
    border-radius:14px;border:1px solid var(--border-glass);
    background:var(--bg-card);color:var(--text-main);
    font-size:15px;font-family:inherit;outline:none;
    transition:all .3s var(--ease-smooth);
}
.yt-input-wrapper input:focus{
    border-color:rgba(var(--dyn),.5);
    box-shadow:0 0 0 4px rgba(var(--dyn),.1);
}
.btn-add{
    padding:0 28px;background:var(--gradient-1);color:#000;
    border:none;border-radius:14px;font-weight:800;font-size:14px;
    cursor:pointer;transition:all .3s var(--ease-spring);
    font-family:inherit;letter-spacing:.3px;
    box-shadow:0 8px 20px -6px rgba(var(--dyn),.5);
}
.btn-add:hover{transform:translateY(-1px) scale(1.02);filter:brightness(1.1)}
.btn-add:active{transform:scale(.97)}

.yt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px}
.yt-card{
    background:var(--bg-card);border-radius:var(--radius);
    overflow:hidden;border:1px solid var(--border-glass);
    cursor:pointer;transition:all .4s var(--ease-spring);
    position:relative;
}
.yt-card:hover{
    transform:translateY(-8px) scale(1.01);
    border-color:rgba(var(--dyn-2),.4);
    box-shadow:var(--shadow-card),0 0 40px -12px rgba(var(--dyn-2),.4);
}
.yt-thumb{
    width:100%;aspect-ratio:16/9;object-fit:cover;
    background:#222;display:block;
    transition:transform .5s var(--ease-smooth);
}
.yt-card:hover .yt-thumb{transform:scale(1.05)}
.yt-info{padding:18px}
.yt-title{font-size:15px;font-weight:700;line-height:1.4;letter-spacing:-.2px}
.yt-play-overlay{
    position:absolute;top:0;left:0;right:0;aspect-ratio:16/9;
    display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.35);opacity:0;transition:opacity .3s;
}
.yt-card:hover .yt-play-overlay{opacity:1}
.yt-play-overlay .play-circle{
    width:64px;height:64px;border-radius:50%;
    background:rgba(0,0,0,.75);
    display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.3);
    transition:transform .3s var(--ease-spring);
}
.yt-card:hover .yt-play-overlay .play-circle{transform:scale(1.1)}
.yt-play-overlay svg{width:28px;height:28px;fill:white;margin-left:4px}
.yt-del-btn{
    position:absolute;top:12px;left:12px;
    width:34px;height:34px;border-radius:50%;
    background:rgba(220,53,69,.85);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.2);
    color:white;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:all .3s var(--ease-spring);z-index:10;padding:0;
    opacity:0;transform:scale(.7);
}
.yt-card:hover .yt-del-btn{opacity:1;transform:scale(1)}
.yt-del-btn:hover{background:rgb(220,53,69);transform:scale(1.15)!important}
.yt-del-btn svg{width:16px;height:16px;fill:white}

/* YouTube modal */
.yt-modal{
    position:fixed;inset:0;background:rgba(0,0,0,.94);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    z-index:1000;display:flex;align-items:center;justify-content:center;
    padding:20px;animation:fadeIn .3s var(--ease-smooth);
}
.yt-modal.hidden{display:none}
.yt-modal-content{
    position:relative;width:100%;max-width:960px;
    aspect-ratio:16/9;background:#000;
    border-radius:var(--radius);overflow:hidden;
    box-shadow:0 32px 80px rgba(0,0,0,.9);
    animation:modalIn .4s var(--ease-spring);
}
@keyframes modalIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.yt-modal-iframe-wrap{position:absolute;inset:0}
.yt-modal-iframe-wrap iframe{width:100%;height:100%;border:none}
.yt-modal-close{
    position:absolute;top:14px;right:14px;
    width:42px;height:42px;border-radius:50%;
    background:rgba(0,0,0,.8);border:1px solid rgba(255,255,255,.2);
    color:white;font-size:20px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:all .3s var(--ease-spring);z-index:10;
    backdrop-filter:blur(12px);
}
.yt-modal-close:hover{background:rgba(255,255,255,.2);transform:scale(1.1) rotate(90deg)}

/* ============================================================
   PLAYER BAR
============================================================ */
.player-bar{
    position:absolute;bottom:12px;left:16px;right:16px;
    height:var(--player-height);
    background:var(--bg-glass-strong);
    backdrop-filter:blur(40px) saturate(1.6);
    -webkit-backdrop-filter:blur(40px) saturate(1.6);
    border:1px solid var(--border-glass);
    border-radius:var(--radius-lg);
    display:flex;align-items:center;
    padding:0 20px;gap:20px;z-index:200;
    box-shadow:0 24px 60px -12px rgba(0,0,0,.9),
               0 0 0 1px rgba(255,255,255,.03),
               0 0 60px -20px rgba(var(--dyn),.3);
    transition:box-shadow .5s;
}

.now-playing{
    display:flex;align-items:center;gap:14px;
    width:28%;min-width:180px;cursor:pointer;
    transition:opacity .3s;
}
.now-playing:hover{opacity:.85}
.np-cover{
    width:56px;height:56px;border-radius:12px;
    background:linear-gradient(135deg, #222, #333);
    overflow:hidden;position:relative;
    box-shadow:0 8px 24px -8px rgba(0,0,0,.8);
    transition:transform .3s var(--ease-spring);
    flex-shrink:0;
}
.now-playing:hover .np-cover{transform:scale(1.05)}
.np-cover img{width:100%;height:100%;object-fit:cover}
.np-cover.playing::after{
    content:'';position:absolute;inset:-2px;
    border-radius:14px;
    background:conic-gradient(from 0deg, var(--accent), var(--accent-2), var(--accent));
    z-index:-1;
    animation:spinRing 3s linear infinite;
    opacity:.7;
    filter:blur(4px);
}
@keyframes spinRing{to{transform:rotate(360deg)}}

.np-info{flex:1;min-width:0}
.np-title{
    font-size:14px;font-weight:700;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    margin-bottom:2px;letter-spacing:-.2px;
}
.np-artist{
    font-size:12px;color:var(--text-muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

.player-controls{
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    flex:1;gap:8px;max-width:560px;
}

.controls-btns{display:flex;align-items:center;gap:16px}
.ctrl-btn{
    background:none;border:none;color:var(--text-main);
    cursor:pointer;transition:all .25s var(--ease-spring);
    display:flex;align-items:center;justify-content:center;
    padding:6px;border-radius:50%;
}
.ctrl-btn:hover{transform:scale(1.15);color:var(--accent-2)}
.ctrl-btn:active{transform:scale(.92)}
.ctrl-btn svg{width:22px;height:22px;fill:currentColor}

.play-pause-btn{
    width:48px;height:48px;border-radius:50%;
    background:var(--gradient-1);
    color:#000 !important;
    margin:0 6px;
    box-shadow:0 8px 24px -4px rgba(var(--dyn),.6);
    transition:all .3s var(--ease-spring);
    position:relative;
}
.play-pause-btn::before{
    content:'';position:absolute;inset:-4px;
    border-radius:50%;
    background:var(--gradient-1);
    opacity:.4;filter:blur(12px);
    z-index:-1;transition:opacity .3s;
}
.play-pause-btn:hover{
    transform:scale(1.08);
    box-shadow:0 12px 32px -4px rgba(var(--dyn),.7);
}
.play-pause-btn:hover::before{opacity:.7}
.play-pause-btn svg{width:22px;height:22px;margin-left:2px}
.play-pause-btn.playing svg{margin-left:0}

.ctrl-btn.side-btn{color:var(--text-muted);position:relative}
.ctrl-btn.side-btn.active{color:var(--accent)}
.ctrl-btn.side-btn.active::after{
    content:'';position:absolute;bottom:-4px;left:50%;
    transform:translateX(-50%);
    width:4px;height:4px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 8px var(--accent);
}

/* Progress */
.progress-container{
    display:flex;align-items:center;gap:12px;
    width:100%;font-size:11px;color:var(--text-muted);
    font-variant-numeric:tabular-nums;
    font-family:'JetBrains Mono',monospace;
}
.progress-bar{
    flex:1;height:4px;background:rgba(255,255,255,.08);
    border-radius:99px;cursor:pointer;position:relative;
    touch-action:none;overflow:visible;
    transition:height .2s;
}
.progress-bar:hover{height:6px}
.progress-fill{
    height:100%;background:var(--gradient-1);
    border-radius:99px;width:0%;
    position:relative;
    box-shadow:0 0 12px rgba(var(--dyn),.6);
    transition:width .1s linear;
}
.progress-fill::after{
    content:'';position:absolute;right:-7px;top:50%;
    transform:translateY(-50%) scale(0);
    width:14px;height:14px;background:#fff;border-radius:50%;
    transition:transform .2s var(--ease-spring);
    box-shadow:0 0 12px rgba(var(--dyn),.8);
}
.progress-bar:hover .progress-fill::after{transform:translateY(-50%) scale(1)}

.right-controls{
    display:flex;align-items:center;justify-content:flex-end;
    gap:14px;min-width:200px;
}
.volume-wrap{display:flex;align-items:center;gap:8px}
.volume-slider{
    width:80px;height:4px;
    -webkit-appearance:none;appearance:none;
    background:rgba(255,255,255,.12);border-radius:99px;
    outline:none;cursor:pointer;
}
.volume-slider::-webkit-slider-thumb{
    -webkit-appearance:none;width:14px;height:14px;
    border-radius:50%;background:#fff;cursor:pointer;
    box-shadow:0 0 8px var(--accent-2);
    transition:transform .2s;
}
.volume-slider::-webkit-slider-thumb:hover{transform:scale(1.2)}
.volume-slider::-moz-range-thumb{
    width:14px;height:14px;border-radius:50%;
    background:#fff;cursor:pointer;border:none;
}

/* Real audio visualizer */
.visualizer{
    display:flex;align-items:flex-end;gap:3px;height:32px;
    opacity:.85;width:60px;
}
.visualizer .bar{
    flex:1;background:var(--gradient-1);
    border-radius:2px 2px 0 0;
    min-height:2px;
    transition:height .08s linear;
}

/* Expand player button */
.expand-btn{
    opacity:0;transition:opacity .3s;
}
.now-playing:hover .expand-btn{opacity:1}

/* ============================================================
   EXPANDED PLAYER (fullscreen immersive)
============================================================ */
.expanded-player{
    position:fixed;inset:0;z-index:500;
    background:#06060a;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:40px 20px;
    overflow:hidden;
    opacity:0;pointer-events:none;
    transition:opacity .5s var(--ease-smooth);
}
.expanded-player.active{opacity:1;pointer-events:auto}
.expanded-bg{
    position:absolute;inset:0;
    background-size:cover;background-position:center;
    filter:blur(80px) saturate(1.8) brightness(.4);
    transform:scale(1.2);
    opacity:.7;
    transition:background-image .6s;
    z-index:-2;
}
.expanded-player::before{
    content:'';position:absolute;inset:0;
    background:radial-gradient(circle at 50% 50%, transparent, rgba(6,6,10,.6));
    z-index:-1;
}
.expanded-close{
    position:absolute;top:24px;right:24px;
    width:44px;height:44px;border-radius:50%;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.12);
    color:white;cursor:pointer;font-size:18px;
    display:flex;align-items:center;justify-content:center;
    transition:all .3s var(--ease-spring);
    z-index:10;
}
.expanded-close:hover{background:rgba(255,255,255,.16);transform:rotate(90deg) scale(1.1)}

.expanded-content{
    display:flex;flex-direction:column;
    align-items:center;
    gap:28px;
    max-width:520px;width:100%;
    z-index:1;
}
.expanded-art{
    width:100%;max-width:360px;aspect-ratio:1;
    border-radius:24px;overflow:hidden;
    box-shadow:0 40px 100px -20px rgba(0,0,0,.9),
               0 0 80px -10px rgba(var(--dyn),.4);
    position:relative;
    animation:artFloat 6s ease-in-out infinite;
    transform-origin:center;
}
@keyframes artFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.expanded-art img{width:100%;height:100%;object-fit:cover}
.expanded-art.playing::before{
    content:'';position:absolute;inset:-3px;border-radius:26px;
    background:conic-gradient(from 0deg, var(--accent), var(--accent-2), var(--accent));
    z-index:-1;animation:spinRing 4s linear infinite;
    opacity:.6;filter:blur(8px);
}

.expanded-info{text-align:center;color:#fff}
.expanded-info h1{
    font-size:24px;font-weight:800;
    margin-bottom:6px;letter-spacing:-.5px;
}
.expanded-info p{color:rgba(255,255,255,.6);font-size:14px}

.expanded-viz{
    width:100%;height:80px;
    display:block;
}

.expanded-progress{
    width:100%;
    display:flex;flex-direction:column;gap:8px;
    color:rgba(255,255,255,.7);
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
}
.expanded-progress .times{display:flex;justify-content:space-between}
.expanded-progress .bar-wrap{
    height:5px;background:rgba(255,255,255,.12);
    border-radius:99px;cursor:pointer;position:relative;
    overflow:hidden;
}
.expanded-progress .bar-fill{
    height:100%;background:linear-gradient(90deg, var(--accent), var(--accent-2));
    border-radius:99px;width:0%;transition:width .1s linear;
    box-shadow:0 0 16px rgba(var(--dyn),.6);
}

.expanded-controls{
    display:flex;align-items:center;gap:24px;
}
.expanded-controls .ctrl-btn{color:#fff}
.expanded-controls .ctrl-btn:hover{color:var(--accent-2)}
.expanded-controls .play-pause-btn{
    width:64px;height:64px;
}
.expanded-controls .play-pause-btn svg{width:28px;height:28px}
.expanded-controls .ctrl-btn svg{width:26px;height:26px}

/* ============================================================
   FAB
============================================================ */
.fab{
    position:absolute;bottom:calc(var(--player-height) + 32px);
    right:32px;width:56px;height:56px;border-radius:50%;
    background:var(--gradient-1);color:#000;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 12px 32px rgba(var(--dyn),.55);
    cursor:pointer;z-index:150;
    transition:all .4s var(--ease-spring);
}
.fab:hover{transform:scale(1.1) rotate(90deg);box-shadow:0 16px 40px rgba(var(--dyn),.7)}
.fab:active{transform:scale(.94) rotate(90deg)}
.fab svg{width:26px;height:26px;fill:currentColor}

/* ============================================================
   TOAST
============================================================ */
.toast{
    position:fixed;bottom:calc(var(--player-height) + 100px);
    left:50%;transform:translateX(-50%) translateY(120px);
    opacity:0;background:rgba(20,20,28,.98);
    color:var(--text-main);padding:14px 24px;
    border-radius:14px;font-size:13px;font-weight:600;
    box-shadow:0 24px 48px -12px rgba(0,0,0,.9);
    z-index:600;
    transition:all .4s var(--ease-spring);
    border:1px solid var(--border-glass);
    border-left:3px solid var(--accent);
    max-width:90vw;
    backdrop-filter:blur(20px);
    font-family:inherit;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.error{border-left-color:#f87171}
.toast.success{border-left-color:var(--accent)}

/* ============================================================
   COMMAND PALETTE
============================================================ */
.palette-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.6);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    z-index:2000;
    display:flex;align-items:flex-start;justify-content:center;
    padding-top:15vh;
    opacity:0;pointer-events:none;
    transition:opacity .25s var(--ease-smooth);
}
.palette-overlay.active{opacity:1;pointer-events:auto}

.palette{
    width:100%;max-width:600px;
    background:var(--bg-glass-strong);
    border:1px solid var(--border-light);
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 32px 100px -20px rgba(0,0,0,.9),
               0 0 0 1px rgba(255,255,255,.03);
    transform:translateY(-20px) scale(.96);
    transition:transform .3s var(--ease-spring);
    backdrop-filter:blur(40px);
}
.palette-overlay.active .palette{transform:translateY(0) scale(1)}

.palette-input-wrap{
    display:flex;align-items:center;gap:12px;
    padding:18px 22px;
    border-bottom:1px solid var(--border-glass);
}
.palette-input-wrap svg{width:20px;height:20px;fill:var(--text-muted);flex-shrink:0}
.palette-input-wrap input{
    flex:1;background:none;border:none;outline:none;
    color:var(--text-main);font-size:16px;font-family:inherit;
}
.palette-input-wrap input::placeholder{color:var(--text-dim)}
.palette-kbd{
    font-family:'JetBrains Mono',monospace;font-size:10px;
    color:var(--text-muted);
    padding:3px 7px;border-radius:5px;
    background:rgba(255,255,255,.06);
    border:1px solid var(--border-glass);
}

.palette-results{
    max-height:400px;overflow-y:auto;
    padding:8px;
}
.palette-results::-webkit-scrollbar{width:6px}
.palette-results::-webkit-scrollbar-thumb{background:rgba(var(--dyn),.3);border-radius:99px}

.palette-item{
    display:flex;align-items:center;gap:14px;
    padding:12px 14px;border-radius:12px;cursor:pointer;
    transition:background .15s;
    color:var(--text-main);font-size:14px;
}
.palette-item:hover,
.palette-item.selected{
    background:rgba(var(--dyn),.15);
}
.palette-item-icon{
    width:32px;height:32px;border-radius:8px;
    background:rgba(255,255,255,.05);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;font-size:16px;
    overflow:hidden;
}
.palette-item-icon img{width:100%;height:100%;object-fit:cover}
.palette-item-content{flex:1;min-width:0}
.palette-item-title{
    font-size:13px;font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.palette-item-sub{
    font-size:11px;color:var(--text-muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.palette-item-hint{
    font-size:10px;color:var(--text-dim);
    font-family:'JetBrains Mono',monospace;
    padding:2px 6px;border-radius:4px;
    background:rgba(255,255,255,.04);
}

.palette-footer{
    display:flex;gap:16px;
    padding:10px 20px;
    background:rgba(0,0,0,.2);
    border-top:1px solid var(--border-glass);
    font-size:11px;color:var(--text-muted);
    font-family:'JetBrains Mono',monospace;
}
.palette-footer span{display:flex;align-items:center;gap:4px}

.palette-empty{
    text-align:center;padding:40px 20px;
    color:var(--text-muted);font-size:13px;
}
.palette-empty .emoji{font-size:32px;display:block;margin-bottom:8px;opacity:.5}

.palette-section-label{
    font-size:10px;font-weight:700;
    text-transform:uppercase;letter-spacing:1px;
    color:var(--text-dim);
    padding:12px 14px 6px;
}

/* ============================================================
   EMPTY STATE
============================================================ */
.empty-state{
    grid-column:1/-1;text-align:center;
    padding:80px 20px;
    animation:fadeIn .5s var(--ease-smooth);
}
.empty-state .emoji{font-size:56px;margin-bottom:16px;opacity:.7;display:block}
.empty-state p{color:var(--text-muted);font-size:14px;line-height:1.7}

/* ============================================================
   SLEEP TIMER
============================================================ */
.sleep-timer-menu{
    position:absolute;
    bottom:calc(var(--player-height) + 24px);
    right:16px;
    background:var(--bg-glass-strong);
    backdrop-filter:blur(32px);
    border:1px solid var(--border-light);
    border-radius:16px;
    padding:8px;
    z-index:250;
    min-width:200px;
    box-shadow:0 24px 60px -12px rgba(0,0,0,.9);
    opacity:0;pointer-events:none;
    transform:translateY(10px);
    transition:all .3s var(--ease-spring);
}
.sleep-timer-menu.active{opacity:1;pointer-events:auto;transform:translateY(0)}
.sleep-timer-menu button{
    display:flex;align-items:center;gap:10px;
    width:100%;padding:10px 14px;
    background:none;border:none;
    color:var(--text-main);cursor:pointer;
    font-size:13px;font-family:inherit;
    border-radius:10px;transition:background .2s;
    text-align:left;
}
.sleep-timer-menu button:hover{background:rgba(var(--dyn),.15)}
.sleep-timer-menu button.active{color:var(--accent);font-weight:600}
.sleep-timer-menu button svg{width:16px;height:16px;fill:currentColor;flex-shrink:0}

/* ============================================================
   MOBILE
============================================================ */
@media (max-width:900px){
    .search-box{width:180px}
    .search-box:focus-within{width:220px}
    .kbd-hint{display:none}
}

@media (max-width:768px){
    :root{--player-height:74px}

    .sidebar{
        position:fixed;bottom:0;left:0;right:0;
        width:100%;height:64px;
        flex-direction:row;padding:0;
        border-right:none;border-top:1px solid var(--border-glass);
        z-index:300;
        background:rgba(10,10,16,.95);
        backdrop-filter:blur(32px);
        border-radius:0;
    }
    .sidebar::after{display:none}
    .logo,.theme-btn{display:none}
    .nav-menu{
        flex-direction:row;width:100%;
        justify-content:space-around;align-items:center;
    }
    .nav-item{
        flex-direction:column;gap:3px;padding:8px;
        font-size:10px;border-radius:0;flex:1;
        transition:color .2s;
    }
    .nav-item.active::after{display:none}
    .nav-item.active{background:transparent;color:var(--accent);box-shadow:none}
    .nav-item.active svg{transform:scale(1.15)}
    .nav-item svg{width:20px;height:20px}
    .nav-shortcut{display:none}

    .main-content{margin-bottom:64px}

    .progress-container{

    .fab{bottom:calc(var(--player-height) + 76px);right:16px;width:52px;height:52px}

<script>
/* ============================================================
   DAUPLAY — REVOLUTION EDITION
   Core
============================================================ */
const $ = (id) => document.getElementById(id);
let toastTimer = null;

function toast(msg, type) {
    const el = $('toast');
    el.textContent = msg;
    el.className = 'toast show' + (type ? ' ' + type : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

const fmtTime = (s) => {
    if (!isFinite(s) || s < 0) return '0:00';
    return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
};
const escapeHtml = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function fetchWithTimeout(url, ms = 30000) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), ms);
    try { return await fetch(url, { signal: controller.signal }); }
    finally { clearTimeout(timer); }
}

/* ============================================================
   SPLASH
============================================================ */
window.addEventListener('load', () => {
    setTimeout(() => {
        const splash = $('splashScreen');
        if (splash) {
            splash.classList.add('fade-out');
            setTimeout(() => splash.remove(), 700);
        }
    }, 1600);
});

/* ============================================================
   INDEXEDDB
============================================================ */
const DB_NAME = 'dauplay_db';
const DB_VERSION = 1;

function openDB() {
    return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('bible')) db.createObjectStore('bible');
            if (!db.objectStoreNames.contains('music')) db.createObjectStore('music');
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
    });
}
async function dbPut(store, key, val) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(store, 'readwrite');
        tx.objectStore(store).put(val, key);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
    });
}
async function dbGet(store, key) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(store, 'readonly');
        const req = tx.objectStore(store).get(key);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
    });
}
async function dbDelete(store, key) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(store, 'readwrite');
        tx.objectStore(store).delete(key);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
    });
}

/* ============================================================
   STATE
============================================================ */
let allSongs = [];
let currentId = null;
let ytLinks = [];
let favorites = new Set();
let recentTracks = [];
let BIBLE_DATA = null;
let currentBookIndex = null;
let currentChapterIndex = 0;

let isShuffle = false;
let repeatMode = 'off';

let ttsPlaying = false;
let ttsQueue = [];
let ttsIndex = 0;
let _voiceCache = null;
let currentBlobURL = null;

// Sleep timer
let sleepTimerId = null;
let sleepEndAt = null;
let sleepMode = 'off';

// Audio analysis
let audioCtx = null;
let analyser = null;
let sourceNode = null;
let vizData = null;
let vizRAF = null;
let expandedVizRAF = null;

const audio = $('audioPlayer');

function getCurrentIndex() {
    if (!currentId) return -1;
    return allSongs.findIndex(s => s.id === currentId);
}

/* ============================================================
   THEME
============================================================ */
function toggleTheme() {
    document.body.classList.toggle('light-mode');
    const isLight = document.body.classList.contains('light-mode');
    $('themeToggle').textContent = isLight ? '🌙 Tema Escuro' : '☀️ Tema Claro';
    $('themeToggleMobile').textContent = isLight ? '🌙' : '☀️';

/* ============================================================
   DYNAMIC COLOR EXTRACTION
============================================================ */
function setDynamicColor(r, g, b) {
    document.documentElement.style.setProperty('--dyn', `${r},${g},${b}`);
    // Secondary color: slightly shifted hue
    document.documentElement.style.setProperty('--dyn-2', `${Math.min(255, (b+r)/2|0)},${Math.min(255,(r+g)/2|0)},${Math.min(255,(g+b)/2|0)}`);
}

function extractColorFromImage(imgSrc) {
    return new Promise((resolve) => {
        if (!imgSrc) { resolve([29,185,84]); return; }
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
            try {
                const c = document.createElement('canvas');
                c.width = c.height = 32;
                const ctx = c.getContext('2d');
                ctx.drawImage(img, 0, 0, 32, 32);
                const data = ctx.getImageData(0, 0, 32, 32).data;
                let r = 0, g = 0, b = 0, count = 0;
                for (let i = 0; i < data.length; i += 16) {
                    const pr = data[i], pg = data[i+1], pb = data[i+2];
                    // Skip very dark/light pixels
                    const lum = (pr + pg + pb) / 3;
                    if (lum < 25 || lum > 230) continue;
                    r += pr; g += pg; b += pb; count++;
                }
                if (count === 0) { resolve([29,185,84]); return; }
                // Boost saturation
                r = r/count|0; g = g/count|0; b = b/count|0;
                const max = Math.max(r,g,b), min = Math.min(r,g,b);
                const boost = 1.4;
                r = Math.min(255, (r + (r - (max+min)/2) * boost)|0);
                g = Math.min(255, (g + (g - (max+min)/2) * boost)|0);
                b = Math.min(255, (b + (b - (max+min)/2) * boost)|0);
                resolve([Math.max(r,20), Math.max(g,20), Math.max(b,20)]);
            } catch { resolve([29,185,84]); }
        };
        img.onerror = () => resolve([29,185,84]);
        img.src = imgSrc;
    });
}

async function loadSongs() {
    const savedStr = localStorage.getItem('dauplay_songs');
    if (savedStr === null) {
        allSongs = [...DEMO_SONGS];
    } else {
        try {
            const parsed = JSON.parse(savedStr);
            allSongs = Array.isArray(parsed) ? parsed : [];
        } catch { allSongs = []; }
    }
    renderSongs();
}

function persistSongs() {
    const meta = allSongs.map(s => ({
        id: s.id, title: s.title, artist: s.artist,
        local: s.local || false, cover: s.cover || null,
        url: s.local ? null : s.url
    }));
    localStorage.setItem('dauplay_songs', JSON.stringify(meta));
}
function persistFavs() {
    localStorage.setItem('dauplay_favs', JSON.stringify([...favorites]));
}

function renderSongs() {
    renderSongsGrid($('musicGrid'), allSongs);
    renderFavorites();
}

function renderFavorites() {
    const grid = $('favGrid');
    if (!grid) return;
    const favSongs = allSongs.filter(s => favorites.has(s.id));
    if (favSongs.length === 0) {
        grid.innerHTML = `<div class="empty-state"><div class="emoji">💚</div><p>Nenhuma música favoritada ainda.<br>Toque no 🤍 para adicionar aqui.</p></div>`;
        return;
    }
    renderSongsGrid(grid, favSongs);
}

function renderSongsGrid(gridEl, songsArray) {
    if (songsArray.length === 0) {
        gridEl.innerHTML = `<div class="empty-state"><div class="emoji">🎵</div><p>Nenhuma música aqui.<br>Toque no + para adicionar músicas.</p></div>`;
        return;
    }
    gridEl.innerHTML = songsArray.map(song => {
        const isFav = favorites.has(song.id);
        const isCurrent = song.id === currentId;
        const cover = song.cover || 'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=400&h=400&fit=crop';
        return `
            <div class="music-card ${isCurrent ? 'active' : ''}" data-song-id="${escapeHtml(song.id)}">
                <div class="card-img-wrapper"><img src="${escapeHtml(cover)}" alt="" loading="lazy"></div>
                <button class="del-btn" data-action="delete" aria-label="Excluir" title="Excluir">
                    <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                </button>
                <button class="fav-btn ${isFav ? 'active' : ''}" data-action="fav" aria-label="${isFav ? 'Remover' : 'Favoritar'}">
                    ${isFav ? '❤️' : '🤍'}
                </button>
                <div class="card-title">${escapeHtml(song.title)}</div>
                <div class="card-artist">${escapeHtml(song.artist || 'Desconhecido')}</div>
            </div>
        `;
    }).join('');
    // Attach 3D tilt
    gridEl.querySelectorAll('.music-card').forEach(attachTilt);
}

function attachTilt(card) {
    card.addEventListener('mousemove', (e) => {
        if (window.matchMedia('(max-width:768px)').matches) return;
        const rect = card.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width - 0.5;
        const y = (e.clientY - rect.top) / rect.height - 0.5;
        card.style.transform = `perspective(900px) rotateX(${-y*6}deg) rotateY(${x*6}deg) translateY(-6px) scale(1.02)`;
    });
    card.addEventListener('mouseleave', () => {
        card.style.transform = '';
    });
}

function setupGridDelegation(gridEl) {
    gridEl.addEventListener('click', (e) => {
        const card = e.target.closest('.music-card');
        if (!card) return;
        const songId = card.dataset.songId;
        if (!songId) return;
        const actionEl = e.target.closest('[data-action]');
        if (actionEl?.dataset.action === 'fav') { e.stopPropagation(); toggleFavorite(songId); return; }
        if (actionEl?.dataset.action === 'delete') { e.stopPropagation(); deleteMusic(songId); return; }
        playSong(songId);
    });
}

function updateActiveCard() {
    document.querySelectorAll('.music-card').forEach(card => {
        card.classList.toggle('active', card.dataset.songId === currentId);
    });
}

async function playSong(songId) {
    const idx = allSongs.findIndex(s => s.id === songId);
    if (idx < 0) return;
    if (ttsPlaying) stopTTS();
    currentId = songId;
    const song = allSongs[idx];

    let audioUrl = song.url;
    if (!audioUrl && song.local) {
        try {
            const blob = await dbGet('music', song.id);
            if (blob) audioUrl = URL.createObjectURL(blob);
        } catch (e) { console.error(e); }
    }
    if (!audioUrl) { toast('Arquivo não encontrado.', 'error'); return; }

    if (currentBlobURL) URL.revokeObjectURL(currentBlobURL);
    currentBlobURL = song.local ? audioUrl : null;

    // Setup audio analysis on first play
    setupAudioAnalysis();

    audio.src = audioUrl;
    audio.play().catch(e => {
        console.error(e);
        if (e.name === 'NotAllowedError') toast('Clique em Play para iniciar.', 'error');
        else toast('Erro ao reproduzir.', 'error');
    });

    // Update UI
    $('npTitle').textContent = song.title;
    $('npArtist').textContent = song.artist || 'Desconhecido';
    const coverUrl = song.cover || 'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=400&h=400&fit=crop';

    if (song.cover) {
        $('npImg').src = song.cover;
        $('npImg').style.display = 'block';
        $('npIcon').style.display = 'none';
    } else {
        $('npImg').style.display = 'none';
        $('npIcon').style.display = 'flex';
    }

    // Expanded player
    $('expandedImg').src = coverUrl;
    $('expandedBg').style.backgroundImage = `url('${coverUrl}')`;
    $('expandedTitle').textContent = song.title;
    $('expandedArtist').textContent = song.artist || 'Desconhecido';

    // Extract dynamic color from cover
    extractColorFromImage(coverUrl).then(([r,g,b]) => setDynamicColor(r,g,b));

    updatePlayUI(true);
    updateActiveCard();
    $('visualizer').classList.add('playing');
    $('npCover').classList.add('playing');
    $('expandedArt').classList.add('playing');

    // Media Session
    updateMediaSession(song);

    // Recent tracks
    addToRecent(song);

    // Sleep timer end-of-track
    if (sleepMode === 'end') {
        sleepMode = 'off';
        updateSleepUI();
    }
}

function addToRecent(song) {
    recentTracks = recentTracks.filter(r => r.id !== song.id);
    recentTracks.unshift({ id: song.id, title: song.title, artist: song.artist, cover: song.cover });
    recentTracks = recentTracks.slice(0, 8);
    localStorage.setItem('dauplay_recent', JSON.stringify(recentTracks));
}

function updateMediaSession(song) {
    if (!('mediaSession' in navigator)) return;
    try {
        navigator.mediaSession.metadata = new MediaMetadata({
            title: song.title,
            artist: song.artist || 'Desconhecido',
            album: 'Dauplay',
            artwork: [
                { src: song.cover || '', sizes: '512x512', type: 'image/jpeg' }
            ]
        });
    } catch {}
}

async function deleteMusic(songId) {
    if (!confirm('Tem certeza que deseja excluir esta música?')) return;
    try { await dbDelete('music', songId); } catch (e) { console.error(e); }

    const wasCurrent = currentId === songId;
    allSongs = allSongs.filter(s => s.id !== songId);
    favorites.delete(songId);
    persistFavs();
    persistSongs();

    if (wasCurrent) {
        stopPlayback();
        currentId = null;
        $('npTitle').textContent = 'Nada tocando';
        $('npArtist').textContent = 'Selecione uma música';
        $('npImg').style.display = 'none';
        $('npIcon').style.display = 'flex';
        if (currentBlobURL) { URL.revokeObjectURL(currentBlobURL); currentBlobURL = null; }
        audio.src = '';
        $('progressFill').style.width = '0%';
        $('currentTime').textContent = '0:00';
        $('totalTime').textContent = '0:00';
    }

    renderSongs();
    toast('Música excluída!', 'success');
}

function toggleFavorite(songId) {
    if (favorites.has(songId)) {
        favorites.delete(songId);
        toast('Removida das favoritas');
    } else {
        favorites.add(songId);
        toast('Adicionada às favoritas ❤️', 'success');
    }
    persistFavs();
    renderSongs();
}

async function handleMusicUpload(event) {
    const files = Array.from(event.target.files);
    if (!files.length) return;
    toast(`Enviando ${files.length} música(s)...`);
    let success = 0, fail = 0;
    for (const file of files) {
        const id = 'local_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
        const song = { id, title: file.name.replace(/\.[^/.]+$/, ''), artist: 'Minha Biblioteca', local: true, cover: null };
        try {
            await dbPut('music', id, file);
            allSongs.push(song);
            success++;
        } catch (e) { console.error(e); fail++; }
    }
    persistSongs();
    renderSongs();
    if (success > 0 && fail === 0) toast(`${success} música(s) adicionada(s)!`, 'success');
    else if (success > 0) toast(`${success} adicionada(s), ${fail} falhou(aram).`);
    else toast(`Falha ao adicionar ${fail} música(s).`, 'error');
    event.target.value = '';
}

   PLAYER

function togglePlay() {
    if (!audio.src) {
        if (allSongs.length) playSong(allSongs[0].id);
        return;
    }
    if (audio.paused) {
        audio.play().catch(e => toast('Erro ao reproduzir', 'error'));
        updatePlayUI(true);
        $('visualizer').classList.add('playing');
        $('npCover').classList.add('playing');
        $('expandedArt').classList.add('playing');
    } else {
        audio.pause();
    }
}

function updatePlayUI(isPlaying) {
    const btns = [$('playBtn'), $('expandedPlayBtn')];
    const icons = [$('playIcon'), $('expandedPlayIcon')];
    btns.forEach(btn => {
        btn.classList.toggle('playing', isPlaying);
        btn.setAttribute('aria-label', isPlaying ? 'Pausar' : 'Reproduzir');
    });
    const svg = isPlaying
        ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'
        : '<path d="M8 5v14l11-7z"/>';
    icons.forEach(i => i.innerHTML = svg);
}

function stopPlayback() {
    audio.pause();
    updatePlayUI(false);
    $('visualizer').classList.remove('playing');
    $('npCover').classList.remove('playing');
    $('expandedArt').classList.remove('playing');
}

function toggleShuffle() {
    isShuffle = !isShuffle;
    $('shuffleBtn').classList.toggle('active', isShuffle);
    $('expandedShuffle').classList.toggle('active', isShuffle);
    toast(isShuffle ? 'Modo aleatório ativado' : 'Modo aleatório desativado');
}

function toggleRepeat() {
    if (repeatMode === 'off') { repeatMode = 'all'; toast('Repetir tudo'); }
    else if (repeatMode === 'all') { repeatMode = 'one'; toast('Repetir música atual'); }
    else { repeatMode = 'off'; toast('Repetição desativada'); }
    const btns = [$('repeatBtn'), $('expandedRepeat')];
    btns.forEach(btn => btn.classList.toggle('active', repeatMode !== 'off'));
    const svgOne = `<svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zm-2-9h-1v4h1v-4zm-2 1h-1v2h1v-2z"/></svg>`;
    const svgAll = `<svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>`;
    btns.forEach(btn => btn.innerHTML = repeatMode === 'one' ? svgOne : svgAll);
}

function nextSong(auto = false) {
    if (allSongs.length === 0) return;
    if (auto && repeatMode === 'one') { audio.currentTime = 0; audio.play(); return; }
    // Sleep timer end-of-track
    if (auto && sleepMode === 'end') {
        audio.pause();
        sleepMode = 'off';
        updateSleepUI();
        toast('🌙 Sleep Timer: reprodução pausada');
        return;
    }
    const idx = getCurrentIndex();
    if (isShuffle) {
        let nextIdx;
        if (allSongs.length > 1) {
            do { nextIdx = Math.floor(Math.random() * allSongs.length); } while (nextIdx === idx);
        } else nextIdx = 0;
        playSong(allSongs[nextIdx].id);
        return;
    }
    let nextIdx = idx + 1;
    if (nextIdx >= allSongs.length) {
        if (repeatMode === 'all' || !auto) nextIdx = 0;
        else { stopPlayback(); return; }
    }
    playSong(allSongs[nextIdx].id);
}

function prevSong() {
    if (allSongs.length === 0) return;
    if (audio.currentTime > 3) { audio.currentTime = 0; return; }
    const idx = getCurrentIndex();
    if (isShuffle) {
        let prevIdx;
        if (allSongs.length > 1) {
            do { prevIdx = Math.floor(Math.random() * allSongs.length); } while (prevIdx === idx);
        } else prevIdx = 0;
        playSong(allSongs[prevIdx].id);
        return;
    }
    let prevIdx = idx - 1;
    if (prevIdx < 0) prevIdx = allSongs.length - 1;
    playSong(allSongs[prevIdx].id);
}

/* ============================================================
   AUDIO ANALYSIS (Real visualizer)
============================================================ */
function setupAudioAnalysis() {
    if (audioCtx) return;
    try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        sourceNode = audioCtx.createMediaElementSource(audio);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 128;
        analyser.smoothingTimeConstant = 0.8;
        sourceNode.connect(analyser);
        analyser.connect(audioCtx.destination);
        vizData = new Uint8Array(analyser.frequencyBinCount);
    } catch (e) {
        console.warn('Audio analysis unavailable:', e);
    }
}

function startVisualizer() {
    if (!analyser) return;
    const bars = document.querySelectorAll('#visualizer .bar');
    function draw() {
        analyser.getByteFrequencyData(vizData);
        const step = Math.floor(vizData.length / bars.length);
        bars.forEach((bar, i) => {
            const v = vizData[i * step] / 255;
            bar.style.height = (2 + v * 30) + 'px';
        });
        vizRAF = requestAnimationFrame(draw);
    }
    draw();
}

function stopVisualizer() {
    if (vizRAF) { cancelAnimationFrame(vizRAF); vizRAF = null; }
    document.querySelectorAll('#visualizer .bar').forEach(b => b.style.height = '2px');
}

/* ============================================================
   AUDIO EVENTS
============================================================ */
audio.addEventListener('timeupdate', () => {
    if (audio.duration && isFinite(audio.duration)) {
        const pct = (audio.currentTime / audio.duration) * 100;
        $('progressFill').style.width = pct + '%';
        $('currentTime').textContent = fmtTime(audio.currentTime);
        $('totalTime').textContent = fmtTime(audio.duration);
        $('progressBar').setAttribute('aria-valuenow', Math.round(pct));
        // Expanded
        $('expandedBarFill').style.width = pct + '%';
        $('expandedCurrent').textContent = fmtTime(audio.currentTime);
        $('expandedTotal').textContent = fmtTime(audio.duration);
    }
});
audio.addEventListener('loadedmetadata', () => {
    if (audio.duration && isFinite(audio.duration)) {
        $('totalTime').textContent = fmtTime(audio.duration);
        $('expandedTotal').textContent = fmtTime(audio.duration);
        $('progressBar').setAttribute('aria-valuemax', Math.round(audio.duration));
    }
});
audio.addEventListener('ended', () => nextSong(true));
audio.addEventListener('pause', () => {
    if (!audio.ended) {
        updatePlayUI(false);
        $('visualizer').classList.remove('playing');
        $('npCover').classList.remove('playing');
        $('expandedArt').classList.remove('playing');
    }
});
audio.addEventListener('play', () => {
    if (!vizRAF) startVisualizer();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    updatePlayUI(true);
});
audio.addEventListener('error', () => {
    const err = audio.error;
    let msg = 'Não foi possível reproduzir.';
    if (err) {
        if (err.code === err.MEDIA_ERR_NETWORK) msg = 'Erro de rede.';
        else if (err.code === err.MEDIA_ERR_DECODE) msg = 'Arquivo corrompido.';
        else if (err.code === err.MEDIA_ERR_SRC_NOT_SUPPORTED) msg = 'Formato não suportado.';
    }
    toast(msg, 'error');
    stopPlayback();
});

/* Media Session action handlers */
if ('mediaSession' in navigator) {
    try {
        navigator.mediaSession.setActionHandler('play', () => togglePlay());
        navigator.mediaSession.setActionHandler('pause', () => togglePlay());
        navigator.mediaSession.setActionHandler('previoustrack', () => prevSong());
        navigator.mediaSession.setActionHandler('nexttrack', () => nextSong(false));
    } catch {}
}

/* ============================================================
   PROGRESS BAR
============================================================ */
function setupProgressBar() {
    const bar = $('progressBar');
    let dragging = false;
    function seek(e) {
        if (!audio.duration || !isFinite(audio.duration)) return;
        const rect = bar.getBoundingClientRect();
        const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        audio.currentTime = pct * audio.duration;
    }
    bar.addEventListener('pointerdown', (e) => {
        dragging = true;
        try { bar.setPointerCapture(e.pointerId); } catch {}
        seek(e);
    });
    bar.addEventListener('pointermove', (e) => { if (dragging) seek(e); });
    bar.addEventListener('pointerup', (e) => {
        dragging = false;
        try { bar.releasePointerCapture(e.pointerId); } catch {}
    });
    bar.addEventListener('keydown', (e) => {
        if (!audio.duration) return;
        if (e.key === 'ArrowRight') { audio.currentTime = Math.min(audio.duration, audio.currentTime + 5); e.preventDefault(); }
        else if (e.key === 'ArrowLeft') { audio.currentTime = Math.max(0, audio.currentTime - 5); e.preventDefault(); }
        else if (e.key === 'Home') { audio.currentTime = 0; e.preventDefault(); }
        else if (e.key === 'End') { audio.currentTime = audio.duration; e.preventDefault(); }
    });

    // Expanded progress bar
    const expBar = $('expandedBarWrap');
    if (expBar) {
        expBar.addEventListener('click', (e) => {
            if (!audio.duration) return;
            const rect = expBar.getBoundingClientRect();
            const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
            audio.currentTime = pct * audio.duration;
        });
    }
}

    audio.muted = false;

function updateVolIcon() {
    const icon = $('volIcon');
    if (audio.muted || audio.volume === 0) {

async function downloadFullBible() {
    const btn = $('downloadBibleBtn');
    const status = $('bibleStatus');
    if (btn) { btn.disabled = true; btn.textContent = 'Baixando...'; }
    if (status) { status.textContent = 'Conectando...'; status.className = 'status'; }

    let lastError = null;
    for (const url of BIBLE_URLS) {
        try {
            if (status) status.textContent = 'Baixando dados...';
            const res = await fetchWithTimeout(url, 60000);
            if (!res.ok) { lastError = new Error('HTTP ' + res.status); continue; }
            const text = await res.text();
            if (status) status.textContent = 'Processando...';
            const data = JSON.parse(text);
            if (!Array.isArray(data) || data.length === 0) throw new Error('Formato inválido');
            await dbPut('bible', 'full', data);
            BIBLE_DATA = data;
            toast('Bíblia baixada!', 'success');
            renderBibleLayout();
            return;
        } catch (e) {
            console.warn('Falhou:', url, e);
            lastError = e;
        }
    }

    if (status) {
        status.textContent = lastError?.name === 'AbortError'
            ? 'Tempo esgotado. Verifique sua conexão.'
            : 'Falha no download. Tente novamente.';
        status.className = 'status error';
    }
    if (btn) { btn.disabled = false; btn.textContent = 'Baixar Bíblia'; }
    toast('Não foi possível baixar.', 'error');
}

/* ============================================================
   TTS
============================================================ */
if ('speechSynthesis' in window) {
    speechSynthesis.onvoiceschanged = () => { _voiceCache = speechSynthesis.getVoices(); };
    _voiceCache = speechSynthesis.getVoices();
}
function getVoicesCached() {
    if (!_voiceCache || _voiceCache.length === 0) {
        _voiceCache = speechSynthesis.getVoices();
    }
    return _voiceCache;
}
function splitForTTS(text, maxLen = 180) {
    if (text.length <= maxLen) return [text];
    const sentences = text.split(/(?<=[.!?;:])\s+/).filter(Boolean);
    const result = [];
    for (const s of sentences) {
        if (s.length <= maxLen) { result.push(s); continue; }
        const parts = s.split(/(?<=[,])\s+/).filter(Boolean);
        let cur = '';
        for (const p of parts) {
            if ((cur + ' ' + p).trim().length > maxLen) {
                if (cur) result.push(cur);
                cur = p;
            } else cur = cur ? cur + ' ' + p : p;
        }
        if (cur) result.push(cur);
    }
    return result;
}

function toggleTTS() {
    if (ttsPlaying) { stopTTS(); return; }
    if (!BIBLE_DATA || currentBookIndex === null) { toast('Selecione um capítulo.', 'error'); return; }
    if (!('speechSynthesis' in window)) { toast('Leitura por voz não suportada.', 'error'); return; }
    const chapter = BIBLE_DATA[currentBookIndex]?.chapters?.[currentChapterIndex];
    if (!chapter) return;

    if (!audio.paused) audio.pause();

    ttsQueue = [];
    chapter.forEach((verse, i) => {
        const text = `${i + 1}. ${verse}`;
        ttsQueue.push(...splitForTTS(text));
    });
    ttsIndex = 0;
    ttsPlaying = true;
    const btn = $('ttsBtn');
    if (btn) { btn.classList.add('playing'); btn.textContent = '⏸ Pausar Leitura'; }
    speakNext();
}

function speakNext() {
    if (!ttsPlaying) return;
    if (ttsIndex >= ttsQueue.length) { stopTTS(); return; }
    const text = ttsQueue[ttsIndex];
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'pt-BR';
    utter.rate = 1;
    utter.pitch = 1;
    const voices = getVoicesCached();
    const ptVoice = voices.find(v => v.lang.toLowerCase().startsWith('pt'));
    if (ptVoice) utter.voice = ptVoice;
    utter.onend = () => { if (!ttsPlaying) return; ttsIndex++; speakNext(); };
    utter.onerror = (e) => {
        if (e.error === 'interrupted' || e.error === 'canceled') return;
        console.error('TTS error:', e);
        ttsIndex++;
        speakNext();
    };
    speechSynthesis.speak(utter);
}

function stopTTS(showToast = false) {
    ttsPlaying = false;
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    ttsQueue = [];
    ttsIndex = 0;
    const btn = $('ttsBtn');
    if (btn) { btn.classList.remove('playing'); btn.textContent = '🔊 Ouvir Capítulo'; }
    if (showToast) toast('Leitura parada.');
}

function extractVideoId(url) {
    if (!url) return null;
    const patterns = [
        /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([\w-]{11})/,
        /^([\w-]{11})$/
    ];
    for (const p of patterns) {
        const m = String(url).match(p);
        if (m) return m[1];
    }
    return null;
}

async function fetchYtTitle(videoId) {
    try {
        const res = await fetchWithTimeout(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${videoId}&format=json`, 10000);
        if (!res.ok) return null;
        const data = await res.json();
        return data.title || null;
    } catch { return null; }
}

async function addYoutubeLink() {
    const input = $('ytInput');
    const url = input.value.trim();
    if (!url) return;
    const id = extractVideoId(url);
    if (!id) { toast('Link do YouTube inválido.', 'error'); return; }

    const title = await fetchYtTitle(id);

    renderYoutube();

function openExpanded() {

    startExpandedViz();

function closeExpanded() {
    $('expandedPlayer').classList.remove('active');
    if (expandedVizRAF) { cancelAnimationFrame(expandedVizRAF); expandedVizRAF = null; }
}

function startExpandedViz() {
    const canvas = $('expandedViz');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    function draw() {
        const w = canvas.width = canvas.clientWidth * devicePixelRatio;
        const h = canvas.height = 80 * devicePixelRatio;
        ctx.clearRect(0, 0, w, h);
        if (!analyser || audio.paused) {
            // Idle wave
            const t = Date.now() / 1000;
            ctx.strokeStyle = 'rgba(255,255,255,.15)';
            ctx.lineWidth = 2 * devicePixelRatio;
            ctx.beginPath();
            for (let x = 0; x <= w; x += 4) {
                const y = h/2 + Math.sin(x*0.01 + t*2) * 8 * devicePixelRatio;
                if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.stroke();
            expandedVizRAF = requestAnimationFrame(draw);
            return;
        }
        analyser.getByteFrequencyData(vizData);
        const bars = 40;
        const step = Math.floor(vizData.length / bars);
        const barW = w / bars * 0.7;
        const gap = w / bars * 0.3;
        const gradient = ctx.createLinearGradient(0, 0, 0, h);
        const dyn = getComputedStyle(document.documentElement).getPropertyValue('--dyn').trim();
        const dyn2 = getComputedStyle(document.documentElement).getPropertyValue('--dyn-2').trim();
        gradient.addColorStop(0, `rgba(${dyn2},0.95)`);
        gradient.addColorStop(1, `rgba(${dyn},0.4)`);
        ctx.fillStyle = gradient;
        for (let i = 0; i < bars; i++) {
            const v = vizData[i * step] / 255;
            const barH = Math.max(4 * devicePixelRatio, v * h * 0.9);
            const x = i * (barW + gap) + gap/2;
            const y = h - barH;
            const radius = Math.min(barW/2, 4 * devicePixelRatio);
            ctx.beginPath();
            ctx.roundRect(x, y, barW, barH, [radius, radius, 0, 0]);
            ctx.fill();
        }
        expandedVizRAF = requestAnimationFrame(draw);
    }
    draw();
}
