<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dauplay — Sua Música, Sua Fé.</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
<style>
    /* ===== SPLASH SCREEN ===== */
    #splashScreen {
        position: fixed; inset: 0; background: #0a0a0f;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        z-index: 99999; transition: opacity 0.6s ease;
    }
    #splashScreen.fade-out { opacity: 0; pointer-events: none; }
    .splash-content { animation: pulseLogo 2s infinite alternate; display: flex; align-items: center; justify-content: center; }
    .splash-img, #splashSvg {
        width: 180px; height: 180px; border-radius: 40px;
        box-shadow: 0 10px 40px rgba(29,185,84,0.4);
        object-fit: cover;
    }
    @keyframes pulseLogo { 0% { transform: scale(1); } 100% { transform: scale(1.05); } }
    .splash-loader {
        margin-top: 40px; width: 120px; height: 4px;
        background: rgba(255,255,255,0.1); border-radius: 2px;
        overflow: hidden; position: relative;
    }
    .splash-bar {
        position: absolute; left: -50%; width: 50%; height: 100%;
        background: linear-gradient(135deg, #1db954, #00d4ff); border-radius: 2px;
        animation: loadBar 1s infinite linear;
    }
    @keyframes loadBar { 0% { left: -50%; } 100% { left: 100%; } }

    /* ===== RESET & BASE ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    :root {
        --bg-base: #0a0a0f;
        --bg-glass: rgba(15, 15, 20, 0.7);
        --bg-card: rgba(255, 255, 255, 0.035);
        --bg-card-hover: rgba(255, 255, 255, 0.07);
        --border-glass: rgba(255, 255, 255, 0.06);
        --border-light: rgba(255, 255, 255, 0.1);
        --text-main: #ffffff;
        --text-muted: #b3b3b3;
        --accent: #1db954;
        --accent-2: #00d4ff;
        --accent-glow: rgba(29, 185, 84, 0.35);
        --gradient-1: linear-gradient(135deg, #1db954, #00d4ff);
        --shadow-card: 0 20px 40px -15px rgba(0, 0, 0, 0.8);
        --shadow-glow: 0 0 30px -10px rgba(29, 185, 84, 0.4);
        --player-height: 90px;
        --radius: 16px;
        --radius-sm: 12px;
    }
    
    body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-base);
        background-image: 
            radial-gradient(circle at 10% 20%, rgba(29,185,84,0.08) 0%, transparent 40%),
            radial-gradient(circle at 90% 80%, rgba(0,212,255,0.08) 0%, transparent 40%),
            radial-gradient(circle at 50% 50%, rgba(127,0,255,0.05) 0%, transparent 60%);
        color: var(--text-main);
        height: 100vh;
        display: flex;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
        width: 260px; background: var(--bg-glass);
        backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
        border-right: 1px solid var(--border-glass);
        display: flex; flex-direction: column; padding: 24px 16px; z-index: 100;
        transition: all 0.3s ease;
    }
    .logo { font-size: 24px; font-weight: 700; letter-spacing: -1px; margin-bottom: 32px; padding-left: 12px; }
    .logo span { background: var(--gradient-1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .nav-menu { display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .nav-item {
        display: flex; align-items: center; gap: 14px;
        padding: 12px 16px; border-radius: var(--radius-sm);
        cursor: pointer; color: var(--text-muted);
        font-weight: 500; font-size: 14px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
    }
    .nav-item:hover { color: var(--text-main); background: var(--bg-card-hover); transform: translateX(4px); }
    .nav-item.active { color: var(--text-main); background: rgba(255,255,255,0.08); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05); }
    .nav-item.active::before {
        content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
        width: 3px; height: 20px; background: var(--gradient-1); border-radius: 0 3px 3px 0;
    }
    .nav-item svg { width: 20px; height: 20px; fill: currentColor; transition: all 0.3s; }
    .nav-item.active svg { color: var(--accent); }
    .theme-btn {
        margin-top: auto; display: flex; align-items: center; justify-content: center;
        gap: 8px; padding: 12px; border-radius: var(--radius-sm);
        background: var(--bg-card); border: 1px solid var(--border-glass);
        color: var(--text-main); cursor: pointer; font-weight: 600; font-size: 13px;
        transition: all 0.3s;
    }
    .theme-btn:hover { background: var(--bg-card-hover); border-color: var(--border-light); }

    /* ===== MAIN ===== */
    .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .header {
        padding: 28px 36px 16px;
        display: flex; justify-content: space-between; align-items: center;
        z-index: 10;
    }
    .header h1 {
        font-size: 28px; font-weight: 700; letter-spacing: -0.5px;
        background: linear-gradient(to right, #fff, #aaa);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        animation: fadeIn 0.5s ease;
    }
    .theme-btn-mobile {
        display: none;
        width: 40px; height: 40px; border-radius: 50%;
        background: var(--bg-card); border: 1px solid var(--border-glass);
        color: var(--text-main); cursor: pointer;
        align-items: center; justify-content: center;
        font-size: 18px; transition: all 0.3s;
    }
    .theme-btn-mobile:hover { background: var(--bg-card-hover); }
    .view-container { flex: 1; overflow-y: auto; padding: 0 36px calc(var(--player-height) + 40px); }
    .view-section { display: none; }
    .view-section.active { display: block; animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* ===== MÚSICAS ===== */
    .music-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 18px; }
    .music-card {
        background: var(--bg-card); border: 1px solid var(--border-glass);
        border-radius: var(--radius); padding: 12px; cursor: pointer;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative; overflow: hidden;
    }
    .music-card:hover {
        background: var(--bg-card-hover);
        transform: translateY(-8px) scale(1.02);
        box-shadow: var(--shadow-card), var(--shadow-glow);
        border-color: rgba(29,185,84,0.3);
    }
    .music-card.active { border-color: var(--accent); box-shadow: 0 0 25px var(--accent-glow); }
    .card-img-wrapper {
        width: 100%; aspect-ratio: 1; border-radius: 10px;
        overflow: hidden; margin-bottom: 12px;
        position: relative; background: #222;
    }
    .card-img-wrapper img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
    .music-card:hover .card-img-wrapper img { transform: scale(1.08); }
    .card-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
    .card-artist { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .fav-btn {
        position: absolute; top: 18px; right: 18px; width: 28px; height: 28px; border-radius: 50%;
        background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255,255,255,0.15); color: white; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        font-size: 12px; transition: all 0.3s; z-index: 5; padding: 0; opacity: 0.85;
    }
    .music-card:hover .fav-btn { opacity: 1; transform: scale(1.15); }
    .fav-btn.active { background: rgba(29,185,84,0.95); border-color: var(--accent); }

    .del-btn {
        position: absolute; top: 18px; left: 18px; width: 28px; height: 28px; border-radius: 50%;
        background: rgba(220, 53, 69, 0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255,255,255,0.15); color: white; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        transition: all 0.3s; z-index: 5; padding: 0; opacity: 0.85;
    }
    .music-card:hover .del-btn { opacity: 1; transform: scale(1.15); }
    .del-btn:hover { background: rgba(220, 53, 69, 1); }
    .del-btn svg { width: 14px; height: 14px; fill: white; }

    /* ===== BÍBLIA ===== */
    .bible-layout { display: flex; gap: 32px; height: calc(100vh - 200px); }
    .bible-sidebar {
        width: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px;
        padding-right: 16px; border-right: 1px solid var(--border-glass);
    }
    .bible-book-btn {
        padding: 10px 14px; background: transparent; border: none; color: var(--text-muted);
        text-align: left; font-size: 13px; border-radius: 8px; cursor: pointer;
        transition: all 0.3s;
    }
    .bible-book-btn:hover, .bible-book-btn.active { background: var(--bg-card-hover); color: var(--text-main); }
    .bible-book-btn.active { font-weight: 600; border-left: 3px solid var(--accent); }
    .bible-reader { flex: 1; overflow-y: auto; padding-right: 16px; }
    .chapter-selector { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
    .chapter-btn {
        width: 38px; height: 38px; border-radius: 50%;
        background: var(--bg-card); border: 1px solid var(--border-glass);
        color: var(--text-main); cursor: pointer; font-size: 13px; transition: all 0.3s;
    }
    .chapter-btn:hover { background: var(--bg-card-hover); border-color: var(--border-light); }
    .chapter-btn.active { background: var(--gradient-1); color: #000; font-weight: bold; border-color: transparent; box-shadow: 0 0 15px var(--accent-glow); }
    .bible-text-content { font-family: 'Playfair Display', serif; font-size: 17px; line-height: 1.9; color: #e0e0e0; }
    .bible-text-content p { margin-bottom: 22px; }
    .verse-num { font-family: 'Inter', sans-serif; font-size: 11px; color: var(--accent); font-weight: 700; vertical-align: super; margin-right: 6px; }

    .tts-bar { margin-bottom: 24px; display: flex; gap: 8px; flex-wrap: wrap; }
    .tts-btn {
        padding: 10px 20px; background: var(--bg-card); border: 1px solid var(--border-glass);
        color: var(--text-main); border-radius: 10px; font-size: 13px; font-weight: 600;
        cursor: pointer; transition: all 0.3s; display: inline-flex; align-items: center; gap: 8px;
    }
    .tts-btn:hover { background: var(--bg-card-hover); border-color: var(--accent); }
    .tts-btn.playing { background: var(--gradient-1); color: #000; border-color: transparent; box-shadow: 0 0 20px var(--accent-glow); }

    .bible-download-card {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        height: 100%; min-height: 400px; text-align: center; padding: 40px;
        background: var(--bg-card); border: 1px dashed var(--border-glass); border-radius: var(--radius); gap: 16px;
    }
    .bible-download-card .icon { font-size: 64px; }
    .bible-download-card h2 { font-size: 24px; font-weight: 700; }
    .bible-download-card p { color: var(--text-muted); max-width: 400px; line-height: 1.6; }
    .bible-download-card .btn-download {
        padding: 16px 32px; background: var(--gradient-1); color: #000;
        border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.3s; margin-top: 8px;
    }
    .bible-download-card .btn-download:hover { transform: scale(1.05); filter: brightness(1.1); box-shadow: 0 0 20px var(--accent-glow); }
    .bible-download-card .btn-download:disabled { opacity: 0.6; cursor: wait; transform: none; }
    .bible-download-card .status { font-size: 13px; color: var(--text-muted); min-height: 20px; }
    .bible-download-card .status.error { color: #f87171; }
    .bible-download-card .status.success { color: var(--accent); }

    /* ===== YOUTUBE ===== */
    .yt-input-wrapper { display: flex; gap: 12px; margin-bottom: 32px; }
    .yt-input-wrapper input {
        flex: 1; padding: 16px; border-radius: var(--radius-sm); border: 1px solid var(--border-glass);
        background: var(--bg-card); color: white; font-size: 15px; outline: none; transition: all 0.3s;
    }
    .yt-input-wrapper input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(29,185,84,0.1); }
    .btn-add {
        padding: 0 24px; background: var(--gradient-1); color: #000; border: none;
        border-radius: var(--radius-sm); font-weight: 700; font-size: 15px; cursor: pointer; transition: all 0.3s;
    }
    .btn-add:hover { filter: brightness(1.1); transform: scale(1.02); box-shadow: 0 0 20px var(--accent-glow); }
    .yt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
    .yt-card {
        background: var(--bg-card); border-radius: var(--radius); overflow: hidden;
        border: 1px solid var(--border-glass); cursor: pointer; transition: all 0.4s; position: relative;
    }
    .yt-card:hover { transform: translateY(-6px); border-color: rgba(0,212,255,0.3); box-shadow: var(--shadow-card); }
    .yt-thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #222; display: block; }
    .yt-info { padding: 16px; }
    .yt-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .yt-play-overlay {
        position: absolute; top: 0; left: 0; right: 0; aspect-ratio: 16/9;
        display: flex; align-items: center; justify-content: center;
        background: rgba(0,0,0,0.3); opacity: 0; transition: opacity 0.3s;
    }
    .yt-card:hover .yt-play-overlay { opacity: 1; }
    .yt-play-overlay .play-circle {
        width: 60px; height: 60px; border-radius: 50%;
        background: rgba(0,0,0,0.75); display: flex; align-items: center; justify-content: center;
        backdrop-filter: blur(10px);
    }
    .yt-play-overlay svg { width: 28px; height: 28px; fill: white; margin-left: 3px; }

    .yt-del-btn {
        position: absolute; top: 12px; left: 12px; width: 32px; height: 32px; border-radius: 50%;
        background: rgba(220, 53, 69, 0.8); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255,255,255,0.2); color: white; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        transition: all 0.3s; z-index: 10; padding: 0;
    }
    .yt-del-btn:hover { background: rgba(220, 53, 69, 1); transform: scale(1.1); }
    .yt-del-btn svg { width: 16px; height: 16px; fill: white; }

    .yt-modal {
        position: fixed; inset: 0; background: rgba(0,0,0,0.92);
        backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
        z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; animation: fadeIn 0.2s ease;
    }
    .yt-modal.hidden { display: none; }
    .yt-modal-content { position: relative; width: 100%; max-width: 900px; aspect-ratio: 16/9; background: #000; border-radius: var(--radius); overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.8); }
    .yt-modal-iframe-wrap { position: absolute; inset: 0; }
    .yt-modal-iframe-wrap iframe { width: 100%; height: 100%; border: none; }
    .yt-modal-close {
        position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; border-radius: 50%;
        background: rgba(0,0,0,0.75); border: 1px solid rgba(255,255,255,0.2);
        color: white; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s; z-index: 10;
        backdrop-filter: blur(10px);
    }
    .yt-modal-close:hover { background: rgba(255,255,255,0.2); transform: scale(1.1); }

    /* ===== PLAYER ===== */
    .player-bar {
        position: absolute; bottom: 0; left: 0; right: 0; height: var(--player-height);
        background: rgba(10, 10, 15, 0.95);
        backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
        border-top: 1px solid var(--border-light);
        display: flex; align-items: center; padding: 0 24px; gap: 24px; z-index: 200;
        box-shadow: 0 -10px 40px -10px rgba(0,0,0,0.8);
    }
    .now-playing { display: flex; align-items: center; gap: 16px; width: 30%; min-width: 200px; }
    .np-cover {
        width: 56px; height: 56px; border-radius: 10px; background: #333;
        overflow: hidden; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .np-cover img { width: 100%; height: 100%; object-fit: cover; }
    .np-cover.playing::after {
        content: ''; position: absolute; inset: 0; border: 2px solid var(--accent); border-radius: 10px;
        box-shadow: inset 0 0 15px var(--accent-glow); animation: pulse 2s infinite;
    }
    @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
    .np-info { flex: 1; min-width: 0; }
    .np-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .np-artist { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .player-controls { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; gap: 8px; }
    .controls-btns { display: flex; align-items: center; gap: 18px; }
    .ctrl-btn {
        background: none; border: none; color: white; cursor: pointer;
        transition: all 0.3s; display: flex; align-items: center; justify-content: center;
    }
    .ctrl-btn:hover { transform: scale(1.15); color: var(--accent-2); }
    .ctrl-btn svg { width: 22px; height: 22px; fill: currentColor; }
    .play-pause-btn {
        width: 46px; height: 46px; border-radius: 50%;
        background: var(--gradient-1); color: #000 !important;
        margin: 0 10px; box-shadow: 0 0 20px rgba(0,212,255,0.4);
        transition: all 0.3s;
    }
    .play-pause-btn:hover { transform: scale(1.08); box-shadow: 0 0 30px rgba(0,212,255,0.6); }
    .play-pause-btn svg { width: 20px; height: 20px; margin-left: 2px; }
    .play-pause-btn.playing svg { margin-left: 0; }

    .ctrl-btn.side-btn { color: var(--text-muted); }
    .ctrl-btn.side-btn.active { color: var(--accent); position: relative; }
    .ctrl-btn.side-btn.active::after {
        content: ''; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%);
        width: 4px; height: 4px; border-radius: 50%; background: var(--accent);
        box-shadow: 0 0 8px var(--accent);
    }

    .progress-container { display: flex; align-items: center; gap: 12px; width: 100%; max-width: 500px; font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .progress-bar {
        flex: 1; height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px;
        cursor: pointer; position: relative; overflow: hidden;
    }
    .progress-fill {
        height: 100%; background: var(--gradient-1); border-radius: 2px; width: 0%;
        position: relative; box-shadow: 0 0 10px rgba(0,212,255,0.5);
    }
    .progress-fill::after {
        content: ''; position: absolute; right: -6px; top: -4px; width: 10px; height: 10px;
        background: white; border-radius: 50%; opacity: 0; transition: opacity 0.2s;
        box-shadow: 0 0 8px var(--accent-2);
    }
    .progress-bar:hover .progress-fill::after { opacity: 1; }

    /* ===== VISUALIZER ===== */
    .visualizer { width: 25%; height: 40px; display: flex; align-items: flex-end; justify-content: flex-end; gap: 3px; opacity: 0.7; }
    .bar {
        width: 4px; background: var(--gradient-1); border-radius: 2px 2px 0 0; height: 10%;
        transition: height 0.1s;
    }
    .playing .bar { animation: bounce 1.2s infinite ease-in-out alternate; }
    .bar:nth-child(2) { animation-delay: 0.2s; }
    .bar:nth-child(3) { animation-delay: 0.4s; }
    .bar:nth-child(4) { animation-delay: 0.1s; }
    .bar:nth-child(5) { animation-delay: 0.5s; }
    .bar:nth-child(6) { animation-delay: 0.3s; }
    @keyframes bounce { 0% { height: 10%; } 100% { height: 100%; } }

    /* ===== FAB ===== */
    .fab {
        position: absolute; bottom: calc(var(--player-height) + 24px); right: 32px;
        width: 56px; height: 56px; border-radius: 50%;
        background: var(--gradient-1); color: #000;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 8px 30px var(--accent-glow); cursor: pointer; z-index: 150;
        transition: all 0.3s;
    }
    .fab:hover { transform: scale(1.1) rotate(90deg); box-shadow: 0 10px 40px var(--accent-glow); }
    .fab svg { width: 26px; height: 26px; fill: currentColor; }

    /* ===== TOAST ===== */
    .toast {
        position: fixed; bottom: calc(var(--player-height) + 100px); left: 50%;
        transform: translateX(-50%) translateY(100px); opacity: 0;
        background: rgba(20,20,25,0.98); color: white; padding: 14px 24px;
        border-radius: var(--radius-sm); font-size: 14px; font-weight: 500;
        box-shadow: 0 20px 40px -10px rgba(0,0,0,0.8);
        z-index: 500; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        border-left: 3px solid var(--accent); max-width: 90vw;
        backdrop-filter: blur(20px);
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast.error { border-left-color: #f87171; }

    /* ===== EMPTY STATE ===== */
    .empty-state { grid-column: 1/-1; text-align: center; padding: 60px 20px; }
    .empty-state .emoji { font-size: 48px; margin-bottom: 16px; }
    .empty-state p { color: var(--text-muted); font-size: 15px; line-height: 1.6; }

    /* ===== MOBILE ===== */
    @media (max-width: 768px) {
        .sidebar {
            position: fixed; bottom: 0; left: 0; right: 0; width: 100%; height: 70px;

<script>
/* ============================================================
   1. HELPERS
============================================================ */
const $ = (id) => document.getElementById(id);
const toast = (msg, type) => {
    const el = $('toast');
    el.textContent = msg;
    el.className = 'toast show' + (type === 'error' ? ' error' : '');
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
};
const fmtTime = (s) => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
const escapeHtml = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ============================================================
   2. SPLASH SCREEN TIMER
============================================================ */
window.addEventListener('load', () => {
    setTimeout(() => {
        const splash = $('splashScreen');
        if (splash) {
            splash.classList.add('fade-out');
            setTimeout(() => splash.remove(), 600);
        }
    }, 2000);
});

/* ============================================================
   3. INDEXEDDB
============================================================ */
const DB_NAME = 'dauplay_db';
const DB_VERSION = 1;

function openDB() {
    return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('bible')) db.createObjectStore('bible');
            if (!db.objectStoreNames.contains('music')) db.createObjectStore('music');
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
    });
}
async function dbPut(store, key, val) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(store, 'readwrite');
        tx.objectStore(store).put(val, key);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
    });
}
async function dbGet(store, key) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(store, 'readonly');
        const req = tx.objectStore(store).get(key);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
    });
}
async function dbDelete(store, key) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(store, 'readwrite');
        tx.objectStore(store).delete(key);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
    });
}

/* ============================================================
   4. ESTADO GLOBAL
============================================================ */
let allSongs = [];
let currentSongIndex = -1;
let ytLinks = JSON.parse(localStorage.getItem('dauplay_yt') || '[]');
let favorites = new Set(JSON.parse(localStorage.getItem('dauplay_favs') || '[]'));
let BIBLE_DATA = null;
let currentBookName = null;
let currentChapterNum = null;

let isShuffle = false;
let repeatMode = 'off';

let ttsPlaying = false;
let ttsQueue = [];
let ttsIndex = 0;

const audio = $('audioPlayer');

/* ============================================================
   5. NAVEGAÇÃO + TEMA
============================================================ */
document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
        const view = item.dataset.view;
        if (view !== 'biblia' && ttsPlaying) stopTTS();
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        item.classList.add('active');
        document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
        $('view-' + view).classList.add('active');
        $('pageTitle').textContent = item.textContent.trim();

        if (view === 'biblia') initBibleView();
        if (view === 'youtube') renderYoutube();
        if (view === 'favoritas') renderFavorites();
    });
});

function toggleTheme() {
    document.body.classList.toggle('light-mode');
    const isLight = document.body.classList.contains('light-mode');
    $('themeToggle').textContent = isLight ? '🌙 Tema Escuro' : '☀️ Tema Claro';
    $('themeToggleMobile').textContent = isLight ? '🌙' : '☀️';
    localStorage.setItem('dauplay_theme', isLight ? 'light' : 'dark');
}
if (localStorage.getItem('dauplay_theme') === 'light') {
    document.body.classList.add('light-mode');
    $('themeToggle').textContent = '🌙 Tema Escuro';
    $('themeToggleMobile').textContent = '🌙';
}

/* ============================================================
   6. FAVORITAS
============================================================ */
function toggleFavorite(songId, event) {
    if (event) event.stopPropagation();
    if (favorites.has(songId)) {
        favorites.delete(songId);
        toast('Removida das favoritas');
    } else {
        favorites.add(songId);
        toast('Adicionada às favoritas ❤️');
    }
    localStorage.setItem('dauplay_favs', JSON.stringify([...favorites]));
    renderSongs();
    renderFavorites();
}

function renderFavorites() {
    const grid = $('favGrid');
    if (!grid) return;
    const favSongs = allSongs.filter(s => favorites.has(s.id));
    if (favSongs.length === 0) {
        grid.innerHTML = `<div class="empty-state"><div class="emoji">💚</div><p>Nenhuma música favoritada ainda.<br>Toque no 🤍 de uma música para adicionar aqui.</p></div>`;
        return;
    }
    renderSongsGrid(grid, favSongs);
}

/* ============================================================
   7. MÚSICAS E CONTROLES
============================================================ */
const DEMO_SONGS = [
    { id: 'demo1', title: 'Acoustic Breeze', artist: 'Dauplay Demo', url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3', cover: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400&h=400&fit=crop' },
    { id: 'demo2', title: 'Summer Vibes', artist: 'Dauplay Demo', url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3', cover: 'https://images.unsplash.com/photo-1493225457124-a1a2a5f5646f?w=400&h=400&fit=crop' },
    { id: 'demo3', title: 'Worship Piano', artist: 'Dauplay Demo', url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3', cover: 'https://images.unsplash.com/photo-1445985543470-41fba5c3144a?w=400&h=400&fit=crop' }
];

async function loadSongs() {
    const saved = JSON.parse(localStorage.getItem('dauplay_songs') || 'null');
    allSongs = (saved && saved.length) ? saved : [...DEMO_SONGS];
    renderSongs();
}

function renderSongs() {
    renderSongsGrid($('musicGrid'), allSongs);
    if ($('favGrid')) renderFavorites();
}

function renderSongsGrid(gridEl, songsArray) {
    gridEl.innerHTML = '';
    if (songsArray.length === 0) {
        gridEl.innerHTML = `<div class="empty-state"><div class="emoji">🎵</div><p>Nenhuma música aqui.</p></div>`;
        return;
    }
    songsArray.forEach(song => {
        const globalIndex = allSongs.findIndex(s => s.id === song.id);
        if (globalIndex < 0) return;
        const isFav = favorites.has(song.id);
        const isCurrent = globalIndex === currentSongIndex;
        const cover = song.cover || 'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=400&h=400&fit=crop';
        const card = document.createElement('div');
        card.className = 'music-card' + (isCurrent ? ' active' : '');
        card.onclick = () => playSong(globalIndex);
        card.innerHTML = `
            <div class="card-img-wrapper"><img src="${cover}" alt=""></div>
            
            <button class="del-btn" onclick="deleteMusic('${song.id}', event)" title="Excluir Música">
                <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
            </button>

            <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFavorite('${song.id}', event)" title="${isFav ? 'Remover' : 'Favoritar'}">
                ${isFav ? '❤️' : '🤍'}
            </button>
            
            <div class="card-title">${escapeHtml(song.title)}</div>
            <div class="card-artist">${escapeHtml(song.artist || 'Desconhecido')}</div>
        `;
        gridEl.appendChild(card);
    });
}

async function playSong(index) {
    if (index < 0 || index >= allSongs.length) return;
    if (ttsPlaying) stopTTS();
    currentSongIndex = index;
    const song = allSongs[index];

    let audioUrl = song.url;
    if (!audioUrl && song.local) {
        try {
            const blob = await dbGet('music', song.id);
            if (blob) audioUrl = URL.createObjectURL(blob);
        } catch (e) { console.error(e); }
    }
    if (!audioUrl) { toast('Arquivo de áudio não encontrado.', 'error'); return; }

    if (window._currentBlobURL) URL.revokeObjectURL(window._currentBlobURL);
    window._currentBlobURL = song.local ? audioUrl : null;

    audio.src = audioUrl;
    audio.play().catch(e => { console.error(e); toast('Não foi possível reproduzir.', 'error'); });

    $('npTitle').textContent = song.title;
    $('npArtist').textContent = song.artist || 'Desconhecido';

    if (song.cover) {
        $('npImg').src = song.cover;
        $('npImg').style.display = 'block';
        $('npIcon').style.display = 'none';
    } else {
        $('npImg').style.display = 'none';
        $('npIcon').style.display = 'flex';
    }

    updatePlayUI(true);
    renderSongs();
    $('visualizer').classList.add('playing');
    $('npCover').classList.add('playing');
}

async function deleteMusic(id, event) {
    if (event) event.stopPropagation();
    if (!confirm('Tem certeza que deseja excluir esta música?')) return;

    try { await dbDelete('music', id); } catch (e) { console.error(e); }

    allSongs = allSongs.filter(s => s.id !== id);
    favorites.delete(id);
    
    localStorage.setItem('dauplay_favs', JSON.stringify([...favorites]));
    const meta = allSongs.map(s => ({
        id: s.id, title: s.title, artist: s.artist,
        local: s.local || false, cover: s.cover || null,
        url: s.local ? null : s.url
    }));
    localStorage.setItem('dauplay_songs', JSON.stringify(meta));

    const songWasPlaying = currentSongIndex !== -1 && !allSongs[currentSongIndex];
    if (songWasPlaying || (allSongs.length === 0)) {
        audio.pause();
        audio.src = '';
        currentSongIndex = -1;
        $('npTitle').textContent = 'Nada tocando';
        $('npArtist').textContent = 'Selecione uma música';
        $('npImg').style.display = 'none';
        $('npIcon').style.display = 'flex';
        updatePlayUI(false);
        $('visualizer').classList.remove('playing');
        $('npCover').classList.remove('playing');
    } else if (currentSongIndex > allSongs.length - 1) {
        currentSongIndex = allSongs.length - 1;
    }

    renderSongs();
    toast('Música excluída!', 'success');
}

function togglePlay() {
    if (!audio.src) { if (allSongs.length) playSong(0); return; }
    if (audio.paused) {
        audio.play();
        updatePlayUI(true);
        $('visualizer').classList.add('playing');
        $('npCover').classList.add('playing');
    } else {
        audio.pause();
        updatePlayUI(false);
        $('visualizer').classList.remove('playing');
        $('npCover').classList.remove('playing');
    }
}

function updatePlayUI(isPlaying) {
    $('playBtn').classList.toggle('playing', isPlaying);
    $('playIcon').innerHTML = isPlaying
        ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'
        : '<path d="M8 5v14l11-7z"/>';
}

function toggleShuffle() {
    isShuffle = !isShuffle;
    $('shuffleBtn').classList.toggle('active', isShuffle);
    toast(isShuffle ? 'Modo aleatório ativado' : 'Modo aleatório desativado');
}

function toggleRepeat() {
    if (repeatMode === 'off') { repeatMode = 'all'; toast('Repetir tudo'); }
    else if (repeatMode === 'all') { repeatMode = 'one'; toast('Repetir música atual'); }
    else { repeatMode = 'off'; toast('Repetição desativada'); }
    
    const btn = $('repeatBtn');
    btn.classList.toggle('active', repeatMode !== 'off');
    if (repeatMode === 'one') {
        btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zm-2-9h-1v4h1v-4zm-2 1h-1v2h1v-2z"/></svg>`;
    } else {
        btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>`;
    }
}

function nextSong(auto = false) {
    if (allSongs.length === 0) return;
    if (auto && repeatMode === 'one') { audio.currentTime = 0; audio.play(); return; }

    if (isShuffle) {
        let nextIndex = currentSongIndex;
        if (allSongs.length > 1) {
            while (nextIndex === currentSongIndex) nextIndex = Math.floor(Math.random() * allSongs.length);
        }
        playSong(nextIndex);
    } else {
        let nextIndex = currentSongIndex + 1;
        if (nextIndex >= allSongs.length) {
            if (repeatMode === 'all' || !auto) nextIndex = 0;
            else { audio.pause(); return; }
        }
        playSong(nextIndex);
    }
}

function prevSong() {
    if (allSongs.length === 0) return;
    if (audio.currentTime > 3) { audio.currentTime = 0; return; }
    if (isShuffle) {
        let prevIndex = currentSongIndex;
        if (allSongs.length > 1) {
            while (prevIndex === currentSongIndex) prevIndex = Math.floor(Math.random() * allSongs.length);
        }
        playSong(prevIndex);
    } else {
        let prevIndex = currentSongIndex - 1;
        if (prevIndex < 0) prevIndex = allSongs.length - 1;
        playSong(prevIndex);
    }
}

audio.addEventListener('timeupdate', () => {
    if (audio.duration && isFinite(audio.duration)) {
        const pct = (audio.currentTime / audio.duration) * 100;
        $('progressFill').style.width = pct + '%';
        $('currentTime').textContent = fmtTime(audio.currentTime);
        $('totalTime').textContent = fmtTime(audio.duration);
    }
});
audio.addEventListener('ended', () => nextSong(true));
audio.addEventListener('pause', () => {
    if (!audio.ended) {
        updatePlayUI(false);
        $('visualizer').classList.remove('playing');
        $('npCover').classList.remove('playing');
    }
});

function seekAudio(e) {
    if (!audio.duration) return;
    const rect = e.currentTarget.getBoundingClientRect();
    audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
}

async function handleMusicUpload(event) {
    const files = Array.from(event.target.files);
    if (!files.length) return;
    toast(`Enviando ${files.length} música(s)...`);
    for (const file of files) {
        const id = 'local_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
        const song = { id, title: file.name.replace(/\.[^/.]+$/, ''), artist: 'Minha Biblioteca', local: true, cover: null };
        try {
            await dbPut('music', id, file);
            allSongs.push(song);
        } catch (e) {
            console.error(e);
            toast('Erro ao salvar: ' + file.name, 'error');
        }
    }
    const meta = allSongs.map(s => ({
        id: s.id, title: s.title, artist: s.artist,
        local: s.local || false, cover: s.cover || null,
        url: s.local ? null : s.url
    }));
    localStorage.setItem('dauplay_songs', JSON.stringify(meta));
    renderSongs();
    toast(`${files.length} música(s) adicionada(s)!`, 'success');
    event.target.value = '';
}

/* ============================================================
   8. BÍBLIA + TTS (CORRIGIDO PARA MOBILE)
============================================================ */
async function initBibleView() {
    if (!BIBLE_DATA) {
        try {
            const saved = await dbGet('bible', 'full');
            if (saved) BIBLE_DATA = saved;
        } catch (e) { console.error(e); }
    }
    if (BIBLE_DATA && Array.isArray(BIBLE_DATA) && BIBLE_DATA.length > 0) {
        renderBibleLayout();
    } else {
        renderBibleDownload();
    }
}

function renderBibleDownload() {
    $('bibleContainer').innerHTML = `
        <div class="bible-download-card">
            <div class="icon">📖</div>
            <h2>Bíblia Sagrada</h2>
            <p>Baixe a <strong>Tradução Brasileira (TB)</strong> completa com os 66 livros para ler offline. Será salva no seu aparelho.</p>
            <button class="btn-download" id="downloadBibleBtn" onclick="downloadFullBible()">📥 Baixar Bíblia Completa</button>
            <div class="status" id="bibleStatus"></div>
            <p style="font-size: 12px; margin-top: 8px; color: var(--text-muted);">Fonte: thiagobodruk/bible (domínio público)</p>
        </div>
    `;
}

async function downloadFullBible() {
    const btn = $('downloadBibleBtn');
    const status = $('bibleStatus');
    if (btn) { btn.disabled = true; btn.textContent = '⏳ Baixando... aguarde'; }
    if (status) { status.className = 'status'; status.textContent = 'Conectando ao servidor...'; }

    const directUrl = 'https://raw.githubusercontent.com/thiagobodruk/bible/master/json/pt_tb.json';
    const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(directUrl);
    let data = null, lastError = null;

    for (const url of [directUrl, proxyUrl]) {
        try {
            if (status) status.textContent = 'Baixando dados da Bíblia...';
            const res = await fetch(url);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            data = await res.json();
            break;
        } catch (e) { console.warn('Falha em', url, e); lastError = e; }
    }

    if (!data) {
        if (status) { status.className = 'status error'; status.textContent = 'Falha no download. Verifique a internet.'; }
        if (btn) { btn.disabled = false; btn.textContent = '📥 Tentar novamente'; }
        console.error(lastError);
        return;
    }
    if (!Array.isArray(data) || data.length === 0 || !data[0].chapters) {
        if (status) { status.className = 'status error'; status.textContent = 'Formato inválido.'; }
        if (btn) { btn.disabled = false; btn.textContent = '📥 Tentar novamente'; }
        return;
    }

    if (status) status.textContent = 'Salvando no aparelho...';
    try {
        await dbPut('bible', 'full', data);
        BIBLE_DATA = data;
        if (status) { status.className = 'status success'; status.textContent = '✓ Bíblia salva!'; }
        toast('Bíblia baixada! Agora você pode ler offline.', 'success');
        setTimeout(() => renderBibleLayout(), 400);
    } catch (e) {
        console.error(e);
        if (status) { status.className = 'status error'; status.textContent = 'Erro ao salvar.'; }
        if (btn) { btn.disabled = false; btn.textContent = '📥 Tentar novamente'; }
    }
}

function renderBibleLayout() {
    $('bibleContainer').innerHTML = `
        <div class="bible-layout">
            <div class="bible-sidebar" id="bibleBooks"></div>
            <div class="bible-reader">
                <div class="chapter-selector" id="bibleChapters"></div>
                <div class="tts-bar" id="ttsBar" style="display:none;">
                    <button class="tts-btn" id="ttsBtn" onclick="toggleTTS()">🔊 Ouvir capítulo</button>
                </div>
                <div class="bible-text-content" id="bibleVerses">
                    <p style="color: var(--text-muted); font-family: 'Inter', sans-serif;">Selecione um livro para começar.</p>
                </div>
            </div>
        </div>
    `;
    renderBibleBooks();
}

function renderBibleBooks() {
    const sidebar = $('bibleBooks');
    if (!sidebar || !BIBLE_DATA) return;
    sidebar.innerHTML = '';
    BIBLE_DATA.forEach((book, idx) => {
        const name = book.name || book.book || book.abbrev || 'Livro ' + (idx + 1);
        const btn = document.createElement('button');
        btn.className = 'bible-book-btn';
        btn.textContent = name;
        btn.onclick = () => {
            if (ttsPlaying) stopTTS();
            sidebar.querySelectorAll('.bible-book-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentBookName = idx;
            renderBibleChapters();
        };
        sidebar.appendChild(btn);
    });
}

function renderBibleChapters() {
    const chaptersContainer = $('bibleChapters');
    const versesContainer = $('bibleVerses');
    if (!chaptersContainer || !BIBLE_DATA) return;
    chaptersContainer.innerHTML = '';
    versesContainer.innerHTML = '<p style="color: var(--text-muted); font-family: \'Inter\', sans-serif;">Selecione um capítulo.</p>';
    const ttsBar = $('ttsBar');
    if (ttsBar) ttsBar.style.display = 'none';

    const book = BIBLE_DATA[currentBookName];
    const chapters = book.chapters || [];
    chapters.forEach((_, idx) => {
        const btn = document.createElement('button');
        btn.className = 'chapter-btn';
        btn.textContent = idx + 1;
        btn.onclick = () => {
            if (ttsPlaying) stopTTS();
            chaptersContainer.querySelectorAll('.chapter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentChapterNum = idx;
            renderBibleVerses();
        };
        chaptersContainer.appendChild(btn);
    });
}

function renderBibleVerses() {
    const container = $('bibleVerses');
    if (!container || !BIBLE_DATA) return;
    const book = BIBLE_DATA[currentBookName];
    const verses = book.chapters[currentChapterNum] || [];
    container.innerHTML = '';
    verses.forEach((text, i) => {
        const p = document.createElement('p');
        p.innerHTML = `<span class="verse-num">${i + 1}</span> ${escapeHtml(text)}`;
        container.appendChild(p);
    });
    const ttsBar = $('ttsBar');
    if (ttsBar) ttsBar.style.display = 'flex';
    updateTTSButton();
    container.parentElement.scrollTop = 0;
}

function updateTTSButton() {
    const btn = $('ttsBtn');
    if (!btn) return;
    if (ttsPlaying) {
        btn.innerHTML = '⏹️ Parar leitura';
        btn.classList.add('playing');
    } else {
        btn.innerHTML = '🔊 Ouvir capítulo';
        btn.classList.remove('playing');
    }
}

function toggleTTS() {
    if (ttsPlaying) { stopTTS(); return; }
    if (!('speechSynthesis' in window)) { toast('Áudio não suportado neste aparelho.', 'error'); return; }
    if (currentBookName === null || currentChapterNum === null) return;

    const verses = BIBLE_DATA[currentBookName].chapters[currentChapterNum];
    if (!verses || verses.length === 0) { toast('Capítulo vazio.', 'error'); return; }

    const unlock = new SpeechSynthesisUtterance('');
    unlock.volume = 0;
    window.speechSynthesis.speak(unlock);

    ttsQueue = verses.map((v, i) => `Verso ${i + 1}. ${v}`);
    ttsIndex = 0;
    ttsPlaying = true;
    updateTTSButton();
    
    setTimeout(speakNext, 150);
}

function speakNext() {
    if (!ttsPlaying) return;
    if (ttsIndex >= ttsQueue.length) {
        ttsPlaying = false;
        updateTTSButton();
        toast('Leitura concluída.', 'success');
        return;
    }
    const text = ttsQueue[ttsIndex];
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'pt-BR';
    utter.rate = 0.95;
    utter.pitch = 1;
    utter.volume = 1;

    const voices = window.speechSynthesis.getVoices();
    const ptVoice = voices.find(v => v.lang.toLowerCase().startsWith('pt'));
    if (ptVoice) utter.voice = ptVoice;

    utter.onend = () => {
        if (!ttsPlaying) return;
        ttsIndex++;
        speakNext();
    };
    utter.onerror = (e) => {
        if (e.error === 'interrupted' || e.error === 'canceled') return;
        console.error('TTS error:', e);
        ttsPlaying = false;
        updateTTSButton();
        toast('Erro na leitura. Verifique a voz do sistema.', 'error');
    };
    
    if (window.speechSynthesis.paused) {
        window.speechSynthesis.resume();
    }
    
    window.speechSynthesis.speak(utter);
}

function stopTTS() {
    ttsPlaying = false;
    ttsIndex = 0;
    ttsQueue = [];
    if ('speechSynthesis' in window) {
        try { window.speechSynthesis.cancel(); } catch (e) {}
    }
    updateTTSButton();
}

/* ============================================================
   9. YOUTUBE (LISTA + PLAYER + EXCLUIR)
============================================================ */
function addYoutubeLink() {
    const input = $('ytInput');
    const url = input.value.trim();
    const id = extractVideoId(url);
    if (!id) { toast('Link do YouTube inválido.', 'error'); return; }
    if (ytLinks.includes(id)) { toast('Vídeo já salvo.', 'error'); return; }
    ytLinks.push(id);
    localStorage.setItem('dauplay_yt', JSON.stringify(ytLinks));
    input.value = '';
    renderYoutube();
    toast('Vídeo salvo!', 'success');
}

function renderYoutube() {
    const grid = $('ytGrid');
    if (!grid) return;
    grid.innerHTML = '';
    if (ytLinks.length === 0) {
        grid.innerHTML = `<div class="empty-state"><div class="emoji">📺</div><p>Nenhum vídeo salvo ainda.<br>Cole um link do YouTube acima para começar.</p></div>`;
        return;
    }
    ytLinks.forEach((id) => {
        const card = document.createElement('div');
        card.className = 'yt-card';
        card.onclick = () => openYtPlayer(id);
        card.innerHTML = `
            <div style="position:relative;">
                <img class="yt-thumb" src="https://img.youtube.com/vi/${id}/mqdefault.jpg" alt="">
                <div class="yt-play-overlay">
                    <div class="play-circle">
                        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </div>
                </div>
                <button class="yt-del-btn" onclick="deleteYoutube('${id}', event)" title="Remover Vídeo">
                    <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                </button>
            </div>
            <div class="yt-info">
                <div class="yt-title">Vídeo do YouTube</div>
                <div style="font-size:12px; color:var(--text-muted); margin-top:4px;">Toque para assistir no app</div>
            </div>
        `;
        grid.appendChild(card);
    });
}

function deleteYoutube(id, event) {
    if (event) event.stopPropagation();
    if (!confirm('Deseja remover este vídeo da lista?')) return;
    ytLinks = ytLinks.filter(v => v !== id);
    localStorage.setItem('dauplay_yt', JSON.stringify(ytLinks));
    renderYoutube();
    toast('Vídeo removido!', 'success');
}

function openYtPlayer(videoId) {
    if (!audio.paused) audio.pause();
    if (ttsPlaying) stopTTS();
    const modal = $('ytModal');
    const iframe = $('ytIframe');
    iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&playsinline=1&modestbranding=1`;
    modal.classList.remove('hidden');
}

function closeYtPlayer() {
    const modal = $('ytModal');
    const iframe = $('ytIframe');
    iframe.src = '';
    modal.classList.add('hidden');
}

function extractVideoId(url) {
    const m = url.match(/(?:youtu\.be\/|v=|shorts\/|embed\/|live\/)([\w-]{11})/);
    return m ? m[1] : null;
}

/* ============================================================
   10. BOOT
============================================================ */
loadSongs();

if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = () => {};
    window.speechSynthesis.getVoices();
}

document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeYtPlayer();
});
</script>
